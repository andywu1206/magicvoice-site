  const trimV=V.map(x=>x.trim());
  const has3=trimV.every((u,idx)=>okURL(u)&&trimV.indexOf(u)===idx);
  if(promo&&!has3){upd();return;}
  const plinks=(promo||has3)?trimV:[];
  lockForm(true);
  const body={
    kind:'biz',
    lang:L,
    text:'内测申请 / Beta application\nProduct: '+pPair[1]+' ('+pPair[0]+')\nPlatform: '+plat+
         (plinks.length===3?'\npromo_task: 要做满 3 条\nPromo links:\n1. '+plinks[0]+'\n2. '+plinks[1]+'\n3. '+plinks[2]
               :(isAria()&&isGmail()?'\npromo_task: 官方政策：Gmail用户暂时免除3条推广任务':''))+
         '\nCode: manual approval only',
    promoLinks:plinks,
    contact:email,
    source:'Beta Application',
    productId:pPair[0],
    product:pPair[1],
    platform:plat,
    sku:pPair[0]+'_'+plat.toLowerCase(),
    page:(location.origin+location.pathname).slice(0,500)
  };
  const ac=(typeof AbortController!=='undefined')?new AbortController():null;
  const tm=setTimeout(()=>{if(ac)try{ac.abort()}catch(_){}},10000);
  fetch(MAIL_ENDPOINT,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body),
    signal:ac?ac.signal:undefined
  }).then(r=>{
    if(r.status===429){const e=new Error('rate');e.rate=true;throw e;}
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }).then(j=>{
    if(!j||j.ok!==true)throw new Error('bad response');
    clearTimeout(tm);
    lockForm(false);
    $('#form').hidden=true;$('#ok').hidden=false;
    const sum=$('#sum');sum.innerHTML='';
    [T[L].em2+': '+email,...plinks].forEach(item=>{
      const row=document.createElement('div'),ic=document.createElement('i'),sp=document.createElement('span');
      ic.textContent='✓';sp.textContent=item;
      row.appendChild(ic);row.appendChild(sp);sum.appendChild(row);
    });
  }).catch(e=>{
    clearTimeout(tm);
    lockForm(false);
    upd();
    showErr(e&&e.rate?'rate':'fail');
  });
};
$('#again').onclick=()=>{clearErr();copied=false;V.fill('');$('#email').value='';$('#form').hidden=false;$('#ok').hidden=true;build()};
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;document.querySelectorAll('.lang button').forEach(x=>x.classList.toggle('on',x==b));build()});
build();
</script></body></html>
