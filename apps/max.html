<!DOCTYPE html>
<!-- Redirect page · v1.3.0 · 2026-10-14. Purchases are handled in the purchase window on /apps/. Kept so existing links to this address keep working. -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>开通 Aria Max — Aria Magic Voice</title>
<meta name="robots" content="noindex">
<script>
/* Paddle payment links (?_ptxn=… / ?ptxn=… / ?txn=…) are passed through to /apps/ unchanged.
   Android -> the Android purchase window. Apple / Windows / ChromeOS, or a machine with no touch screen -> the Mac one.
   A touch device whose user agent does not say Android (Android "desktop site" mode) cannot be told from a laptop by user agent alone,
   so it stays on this page and the visitor picks below. With scripts off nothing redirects either (no meta refresh on this page on purpose:
   it would have to guess the platform, and a wrong guess shows an Android buyer the Mac price); the two links below are the whole page. */
(function () {
  var ua = navigator.userAgent || "";
  var q = location.search || "";
  if (/[?&](_ptxn|ptxn|txn)=/.test(q)) { location.replace("/apps/" + q + location.hash); return; }
  if (/Android/i.test(ua)) { location.replace("/apps/?buy=and#aria"); return; }
  var ambiguous = (navigator.maxTouchPoints || 0) > 0 && !/iPhone|iPad|iPod|Macintosh|Mac OS X|Windows|CrOS/i.test(ua);
  if (ambiguous) return;
  location.replace("/apps/?buy=mac#aria");
})();
</script>

  a{color:#0071e3;font-weight:600;text-decoration:none;display:inline-block;margin:6px 12px}
</style>
</head>

</body>
</html>
