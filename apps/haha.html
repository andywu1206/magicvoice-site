.mq{margin:0 0 22px;border:1px solid var(--line-soft);border-radius:16px;background:var(--card);

.mqs{position:absolute;inset:0;opacity:0;transform:translateY(6px);pointer-events:none;
  transition:opacity .16s ease,transform .16s ease}
.mqs.on{opacity:1;transform:none;pointer-events:auto;position:relative;
  transition:opacity .34s ease .14s,transform .34s ease .14s}

   一句中文描述能一行走完；英文长句仍会在可读宽度内换行，不至于拉成一条线。 */

    radial-gradient(900px 780px at 88% 44%,color-mix(in srgb,var(--b1) 44%,transparent),transparent 66%),
    /* ★ 方案 8 新增两层（上面 Hero 两层一个字节未动）：
       band8 = JS 用离屏 canvas 原样重绘 Hero 渐变后，取其【底边那一行】的真实像素做成的水平色带
       fade8 = 盖在色带上的垂直淡出，把色带从上往下化到纯白 */
    var(--fade9,linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.62) 46%,#fff 90%)),
    /* fallback 必须是 none，不能是 transparent —— transparent 是颜色，不是合法的
       <bg-image>。JS 没来得及设 --band9 时，var() 会替换出 transparent，整条
       background 简写变成 invalid-at-computed-value-time，**五层全部丢弃**、整页白。
       改成 none：装饰层缺席就只是这一层为空，主渐变照常显示。（2026-08-08 白页事故）*/
    var(--band9,none),
    var(--page);
  background-size:100% 620px,100% 620px,100% 360px,100% 360px,100% 100%;

     HIG：sidebar 文字多 → 用 regular 变体，靠 blur + 调整背景亮度保可读性。
     .60→.30 不透明度 · 26px→12px 模糊 · brightness 提亮 · 双边缘厚度 · 138° specular。
     依据：原理是 lensing（弯曲光）不是 scatter（散射）—— 散射就是磨砂。*/
  background:rgba(255,255,255,.30);

/* ── 公开反馈 / 商务合作弹窗（契约 PUBLIC_FEEDBACK_MODAL_OWN_CLASS_FGATE_V1）──
   🔴 必须留在公开 CSS 区，不得移进 ADMIN 哨兵块。
   历史事故（2026-08-06 线上）：这个弹窗原本复用 admin 登录弹层的 .gate，
   而 .gate 的 CSS 定义在 ADMIN 哨兵块里 → 发布时被整段剥掉 →
   公开页面上「没有 display:none」= 弹窗永久悬挂，「没有 .on 规则」= 点 Cancel 毫无反应。
   一个原因两个症状，三道构建校验一道都没响（它们只查 JS，不查 CSS）。
   → 因此独立成 .fgate，与 admin 的 .gate 彻底解耦：
     以后谁调 admin 登录弹层的 .gate（z-index / backdrop / 遮罩色），都不会再静默改到公开弹窗。 */
.fgate{display:none;position:fixed;inset:0;z-index:50;place-items:center;
  background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.fgate.on{display:grid}

   为什么改：下拉的三角意味着"这里显示的是当前选中项"，可这个按钮显示的一直是

/* Harry 2026-08-31 第三轮 · 两段「同左同宽」且整排必须避开左侧固定侧栏 —— 前两版都翻在这
   ❌ 版本一 auto-fill+minmax(164px,1fr) 放在 shrink-to-fit 容器里：repeat 数按「不定尺寸」算 → 塌成 1 列
   ❌ 版本二 两段 width:100% 拉满：6 张卡那排铺进侧栏底下 → 公众号整张被盖住，扫不出来
   ✅ 现在：容器给死宽度并居中 + 列数写死 → 两段左边/宽度天然一致，且整排宽度 ≤ 侧栏净空
   侧栏净空推导（data-v=9 · viewport ≥ 1280 时为常数，与窗口宽无关）：
     侧栏 right   = (100vw-1280)/2 + 14 + 236 = (100vw-1280)/2 + 250
     .sp-wrap left = 48 + ((100vw-15) - 96 - 1184)/2 = (100vw-1295)/2 + 48
     两者之差恒 = 209.5px；.sp-wrap 宽 1184 → 居中内容宽 W 需 (1184-W)/2 ≥ 209.5 → W ≤ 765
   取 744，留 ~20px 余量。*/
.fm-all{display:block;width:100%;max-width:744px;margin-left:auto;margin-right:auto}
/* Harry 2026-08-31 15:14:00 周一 北京时间 (CST) · cursor-composer
   标题「关注我」到国内 + International 看成一整块，离左侧菜单远一点。
   位移 = 2 × 卡片间距（.fm-grid gap 15px）= 30px。
   窄屏侧栏变浮层，不位移，避免把内容挤出右缘。 */
@media (min-width:761px){

}

/* ── 哈哈资讯 · 对外视图（2026-09-01）· 全部 .hz- 前缀，不碰母体任何类名 ── */
/* 侧栏是 position:fixed 浮在左边（母体是居中布局所以天然躲开）。
   本页左对齐，必须自己让开：实测侧栏右边缘 330px，给 margin-left 让内容起点在它右侧。
   窄屏侧栏会收起，用 max() 保底不至于把内容推出视口。 */
.hz-block{max-width:760px;text-align:left;
  margin-left:max(0px,calc((100vw - 1280px)/2 + 236px + 30px))}
/* 🔴 BUG-P15-0003（Harry 2026-09-01 手机实测「完全被那个菜单挡住了」）：
   原来这里写死 margin-left:0，等于亲手把移动端的让位关掉；上面那句 max(0px,…) 在窄屏
   也会算出负数退化成 0。两处叠加 = 侧栏直接盖在正文上。
   现在照 index.html 已验证的做法给窄屏【正的】左距：1100 档侧栏 200px → 246px；
   760 档侧栏收成 44px 窄条 → 68px。
   ⚠️ 教训：max(0px,…) / clamp 这类"防负数"写法在窄屏会静默退化成 0，看着安全，
      实际是把移动端保护关掉了。窄屏必须显式给正值。 */
@media (max-width:1100px){.hz-block{margin-left:246px}}
@media (max-width:760px){.hz-block{margin-left:68px;margin-right:18px}}
@media (max-width:520px){.hz-block{margin-left:60px;margin-right:14px}}

/* ══ 取色器：把 Hero 的两层渐变在离屏 canvas 上原样重绘，读底边那一行的真实像素 ══
   这样往下延伸的色带在每个横向位置都跟上面对得上，不会出现「左边对上右边割裂」。 */
function sampleHeroBottom(app,h){
  try{
    const W=Math.max(2,Math.round(app.getBoundingClientRect().width));
    const H=Math.max(2,Math.round(h));
    const cs=getComputedStyle(app);
    const hex=v=>cs.getPropertyValue(v).trim();
    const rgba=(c,a)=>{let m=c.replace('#','');
      if(m.length===3)m=m.split('').map(s=>s+s).join('');
      const n=parseInt(m,16);
      return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';};
    const b1=hex('--b1'),b2=hex('--b2'),b3=hex('--b3');
    const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
    const x=cv.getContext('2d',{willReadFrequently:true});
    x.fillStyle=hex('--page')||'#fff'; x.fillRect(0,0,W,H);
    /* 层2 radial（下层）：900x780 椭圆 at 88% 44% */
    x.save();
    const cx=.88*W, cy=.44*H, rx=900, ry=780;
    x.translate(cx,cy); x.scale(1,ry/rx); x.translate(-cx,-cy);
    const rg=x.createRadialGradient(cx,cy,0,cx,cy,rx);
    rg.addColorStop(0,rgba(b1,.44)); rg.addColorStop(.66,rgba(b1,0));
    x.fillStyle=rg; x.fillRect(-W,-H*4,W*3,H*9);
    x.restore();
    /* 层1 linear 118deg（上层）：CSS 角度 0=向上、顺时针 */
    const th=118*Math.PI/180, dx=Math.sin(th), dy=-Math.cos(th);
    const L=Math.abs(W*dx)+Math.abs(H*dy);
    const g=x.createLinearGradient(W/2-dx*L/2,H/2-dy*L/2,W/2+dx*L/2,H/2+dy*L/2);
    g.addColorStop(0,rgba(b2,.52)); g.addColorStop(.48,rgba(b3,.34)); g.addColorStop(.8,rgba(b3,0));
    x.fillStyle=g; x.fillRect(0,0,W,H);
    /* 读底边那一行，横向取 9 个点 */
    const N=9,st=[];
    for(let i=0;i<N;i++){
      const px=Math.min(W-1,Math.round(i*(W-1)/(N-1)));
      const d=x.getImageData(px,H-1,1,1).data;
      st.push('rgb('+d[0]+','+d[1]+','+d[2]+') '+Math.round(i*100/(N-1))+'%');
    }
    return 'linear-gradient(90deg,'+st.join(',')+')';
  }catch(e){return 'transparent';}
}

/* ══ 浏览端选择器 · 电脑 / 平板 / 手机（Harry 2026-09-01）══
   一个控件两个用途：Harry 自己的人工测试工具 + 读者的"请求桌面版网站"。

   为什么是【两套机制】而不是一套 —— 这是被浏览器规则逼出来的，不是懒：
   · 手机 / 平板 → 改 <meta viewport> 的宽度。浏览器自带的"请求桌面版网站"用的就是这一招，
     媒体查询会按新宽度重新命中，布局 100% 真实，零 CSS 重复。
   · 桌面 → 桌面浏览器【忽略】viewport meta，这条路走不通；改成 window.open 开一个
     指定宽度的真窗口，窗口视口就是 390 / 820，媒体查询自然正确。比 iframe 简单，
     也比 iframe 好用（可拖、可再缩放），而且不给公网页面新增内嵌框架这层攻击面。

   ❌ 别改成"给 html 加个 class 再复制一份响应式 CSS" —— 那份副本迟早跟主规则走散，
      到时候预览出来的是假的，比没有更糟。
   ⚠️ 已知小瑕疵：桌面开出来的预览窗口里，screen.width 仍然是那块大屏，所以它自己的
      选择器会显示"电脑端"高亮，而画面其实是手机布局。预览窗口里的高亮状态不必当真。 */
const DEV_KEY='hasDev', DEVW={pc:1180,pad:820,ph:390};
const DEV_ICON={
 pc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3.4" width="20" height="13.2" rx="2"/><path d="M8.5 20.6h7M12 16.6v4"/></svg>',
 pad:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.2" y="2.2" width="15.6" height="19.6" rx="2.4"/><path d="M11.1 19h1.8"/></svg>',

/* 用 screen.width 而不是 innerWidth：innerWidth 会被我们自己改的 viewport 带跑，
   一改就再也算不回"这台设备本来是什么端"了。screen.width 不受 viewport meta 影响。 */
function devNative(){ const w=(screen&&screen.width)||innerWidth||0;
  return w<=760?'ph':(w<=1100?'pad':'pc'); }
const DEV_VP_DEFAULT='width=device-width, initial-scale=1, viewport-fit=cover';
let devSel=devNative(), devBroken=false;
try{ const _d=localStorage.getItem(DEV_KEY); if(DEVW[_d]) devSel=_d; }catch(_){}
function devApplyMeta(){
  const m=document.querySelector('meta[name="viewport"]'); if(!m) return;
  const nat=devNative();
  const want=(nat==='pc'||devSel===nat)?DEV_VP_DEFAULT:('width='+DEVW[devSel]);
  if(m.getAttribute('content')===want) return;
  const before=document.documentElement.clientWidth;
  m.setAttribute('content',want);
  if(want===DEV_VP_DEFAULT) return;
  /* 少数浏览器不认"改属性"，得整个节点换掉才重排；再不行就是真不支持，老实退回去。 */
  setTimeout(()=>{
    if(document.documentElement.clientWidth!==before) return;
    const cur=document.querySelector('meta[name="viewport"]');
    const n=cur.cloneNode(); n.setAttribute('content',want); cur.replaceWith(n);
    setTimeout(()=>{
      if(document.documentElement.clientWidth!==before) return;
      devBroken=true; devSel=devNative();
      try{ localStorage.removeItem(DEV_KEY); }catch(_){}
      document.querySelector('meta[name="viewport"]').setAttribute('content',DEV_VP_DEFAULT);
      paintDev();
    },280);
  },280);
}

/* ══ 下载点击追踪（Harry 2026-08-04：点了按钮就算一次下载，不用 GitHub 真实下载量）══
   诚实边界：这是纯前端 hook 点，只写本机 localStorage，不是全局共享的公开数字。
   静态站没有后端，做不出"所有人都看到同一个数字"的公开计数器，除非接一个
   计数服务（第三方或 Harry 自己的 Cloudflare Worker）——这条待 Harry 决定，
   决定前不在页面上展示任何假数字。track() 只是把埋点做好，接口一确定就能直接接上。
   ⚠️ 不属于 Admin，公网版保留 —— 别再把它包进 ADMIN 哨兵（2026-08-04 踩过一次）。 */
const TKEY='harryAppStore.clicks.v1';
/* 计数端点。公网版也要保留 —— 数字是在公网被点出来的。
   ⚠️ 这里只「写」，读取（/stats）是 admin-only，另在 ADMIN 块里。
   放在 track() **前面**：const 有 TDZ，放后面万一将来有人在初始化期调 track 就炸
   （这个坑跑马灯的 MKT 已经踩过一次）。 */
const DLHIT='https://harry-app-store-feedback.andywu1206.workers.dev/dl';
function track(k){try{
    const o=JSON.parse(localStorage.getItem(TKEY)||'{}');
    o[k]=(o[k]||0)+1;localStorage.setItem(TKEY,JSON.stringify(o));
  }catch(e){}
  /* ── 全局计数（契约 DOWNLOAD_CLICK_COUNT_APPEND_ONLY_V1 · 2026-08-08 接上）──
     用 sendBeacon 而不是 302 重定向：重定向要把目标 URL 交给 Worker，
     写死在 Worker 里 = 链接两个真源迟早对不上；由前端传 = 开放重定向漏洞。
     beacon 拿到的数字完全一样，而且 **href 保持原样**（右键复制链接仍可用、
     用户看得见去哪），Worker 挂了也不影响下载 —— 同样收益，风险小一个数量级。
     fire-and-forget：绝不 await、绝不 preventDefault，不挡下载开始。 */
  try{
    const a=String(k||'').split(':');
    // aria:beta:gh → 三段；aria:free / aria:pro → 两段，源记成 as（App Store）
    const body=JSON.stringify(a.length>=3
      ? {app:a[0],tier:a[1],src:a[2]}
      : {app:a[0],tier:a[1],src:'as'});
    // text/plain 是 sendBeacon 的默认类型，不触发 CORS 预检；Worker 那边不挑 content-type
    const blob=new Blob([body],{type:'text/plain;charset=UTF-8'});
    if(!(navigator.sendBeacon&&navigator.sendBeacon(DLHIT,blob))){
      // sendBeacon 被拒（少数浏览器/隐私模式）→ 退到 keepalive fetch，同样不等结果
      fetch(DLHIT,{method:'POST',body,keepalive:true,mode:'cors'}).catch(()=>{});
    }
  }catch(e){}
}
/* 🔴 蓝军 P1-2（2026-08-05）：这里原先是内联 onclick="track('...${E(sc.i)}')"。
   E() 在那个位置**不成立** —— 浏览器先把属性值做 HTML 解码、再当 JS 源码解析，
   E() 把 ' 转成 &#39;，解码后又变回 '，等于没转。蓝军浏览器实证：
     payload   = x'); window.__blueXSS=1; ('
     属性实际值 = track('aria:beta:x'); window.__blueXSS=1; ('')
     注入执行   = true
   对照：同一个 payload 放进 href 和文本节点都**不执行** —— E() 在那两处是够的，
   只有事件处理器属性不够。当时 sc.i 还到不了 overlay 所以没被利用，但链接编辑器
   已经在编辑它隔壁的 sc.u，属于「哪天 .i 可编辑就当天变成真 XSS」。
   改成 data-track 属性（普通属性上下文，E() 在这里是成立的）+ 事件委托：
   dataset 读值不经过 JS 解析器，从机制上关掉这个上下文。 */
document.addEventListener('click',e=>{
  const t=e.target&&e.target.closest&&e.target.closest('[data-track]');
  if(t)track(t.getAttribute('data-track'));});

const MAIL='magicvoice.team@outlook.com';
const FORMS={
  fb:{zh:{t:'遇到什么问题？',
        d:`直接把问题写在下面（越具体越好：什么时候出现、在哪个 App、复现步骤）。内容会直接发到 <code>${MAIL}</code>。只发送你写的这段文字，不会附带录音、原文、日志或截图。`,
        ph:'例如：在飞书里说完话，文字上屏后光标跳到了行首…'},
      en:{t:'What went wrong?',
        d:`Describe it below — the more specific the better (when it happens, which app, how to reproduce). It goes straight to <code>${MAIL}</code>. Only the text you type is sent — no recordings, no transcripts, no logs, no screenshots.`,
        ph:'e.g. After the text lands in Slack, the caret jumps to the start of the line…'}},
  biz:{zh:{t:'商务合作',
        d:`请简单说明合作或投资意向（投放、代理、投资、集成等），我会尽快回复。内容会直接发到 <code>${MAIL}</code>。`,
        ph:'例如：我们想在某平台做联合推广，预算和排期是…'},
      en:{t:'Business enquiry',
        d:`Tell me briefly what you have in mind — partnership, distribution, investment, integration. It goes straight to <code>${MAIL}</code>.`,
        ph:'e.g. We would like to explore a co-marketing campaign…'}}};
let FORM_KIND='fb';   /* 当前开的是哪张表（fb 问题反馈 / biz 商务合作）——
                         Worker 建好后要靠它区分收件标题，别再丢掉这个信息 */
const FEEDBACK_SOURCE='Harry App Store';
const FEEDBACK_KIND_LABEL={fb:'Feedback',biz:'Partnership'};
const FORM_CLOSE_SECONDS=15;
let formCloseTimer=null,formCloseTick=null;
function clearFormCloseTimers(){
  if(formCloseTimer)clearTimeout(formCloseTimer);
  if(formCloseTick)clearInterval(formCloseTick);
  formCloseTimer=null;formCloseTick=null;
}
function closeForm(){
  clearFormCloseTimers();
  $('#mgate').classList.remove('on');
}
function formButtonLabels(){
  $('#mNo').textContent=lang==='zh'?'取消':'Cancel';
  $('#mYes').textContent=lang==='zh'?'发送':'Send';
}
function showSentCountdown(){
  clearFormCloseTimers();
  let left=FORM_CLOSE_SECONDS;
  const zh=lang==='zh',ok=$('#mOk');
  $('#mYes').disabled=true;
  $('#mNo').textContent=zh?'关闭':'Close';
  const render=()=>{
    ok.textContent=zh
      ?`✓ 已发送，谢谢！这个窗口将在 ${left} 秒后关闭，也可以点「关闭」。`
      :`✓ Sent. This window will close in ${left} seconds. You can also click Close.`;
  };
  render();
  ok.classList.add('on');
  formCloseTick=setInterval(()=>{left=Math.max(0,left-1);render();},1000);
  formCloseTimer=setTimeout(closeForm,FORM_CLOSE_SECONDS*1000);
}
function feedbackProductName(){
  const a=APPS[cur]||{};
  return (a[lang]&&a[lang].t)||(a.en&&a.en.t)||(a.zh&&a.zh.t)||cur;
}
function feedbackPage(){
  return location.protocol==='file:'?'local-file-preview':location.href.slice(0,500);
}
function openForm(k){
  clearFormCloseTimers();
  FORM_KIND=k;
  const f=FORMS[k][lang];
  $('#mTitle').textContent=f.t;$('#mDesc').innerHTML=f.d;
  const ta=$('#mText');ta.placeholder=f.ph;ta.value='';
  $('#mYes').disabled=false;formButtonLabels();
  $('#mOk').classList.remove('on');$('#mgate').classList.add('on');setTimeout(()=>ta.focus(),60);
}
function actionLinkProblem(){
  const missing=['mgate','mText','mYes','mNo'].filter(id=>!$('#'+id));
  if(missing.length)return lang==='zh'
    ?`表单接线缺失：${missing.join(', ')}`
    :`Form wiring missing: ${missing.join(', ')}`;
  return '';
}
function setActionLinkHealth(id,problem){
  const el=$('#'+id); if(!el)return;
  el.classList.toggle('unavailable',!!problem);
  const old=el.querySelector('.warnmark'); if(old)old.remove();
  if(problem)el.insertAdjacentHTML('beforeend',warnMark(problem));
}
function auditActionLinks(){
  const problem=actionLinkProblem();
  setActionLinkHealth('fbLink',problem);
  setActionLinkHealth('bizLink',problem);
}
$('#fbLink').onclick=()=>openForm('fb');
$('#bizLink').onclick=()=>openForm('biz');
auditActionLinks();
$('#mNo').onclick=closeForm;
/* 🔴 2026-08-05：这里原本是「假发送」—— 只有一行注释写着「真实实现：POST 到
   自己的 Worker 端点」，然后直接弹「✓ 已发送，谢谢！我会尽快回复。」
   一个网络请求都没有。用户写完点发送，看到已发送，内容哪儿都没去，
   Harry 后台永远收不到。这比按钮点不动更糟：按钮坏了用户会换条路找你，
   假成功让用户以为反馈过了，就再也不来了。Guide 当时还把它记成
   「✅ 已按规范实现，实测通过」—— 那是假账，一并已更正。

   规范（NO_MAILTO_USE_INAPP_FORM_V1）要求 Web 端 POST 到自有 Worker。
   那个 Worker 还不存在，需要 Harry 的 Cloudflare 账号才能部署。
   在它建起来之前，宁可诚实降级：把内容复制到剪贴板 + 明说还没接通自动发送，
   也绝不再显示一个假的「已发送」。禁 mailto: 的铁律继续守。            */
const MAIL_ENDPOINT='https://harry-app-store-feedback.andywu1206.workers.dev/';   /* Cloudflare Worker + KV：2026-08-05 Codex E2E 已写入并回读 */
$('#mYes').onclick=async()=>{
  const t=$('#mText').value.trim();
  if(!t){$('#mText').focus();return;}
  const zh=lang==='zh';
  if(MAIL_ENDPOINT){
    try{
      const r=await fetch(MAIL_ENDPOINT,{method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          kind:FORM_KIND,
          lang:lang,
          text:t,
          source:FEEDBACK_SOURCE,
          productId:cur,
          product:feedbackProductName(),
          category:FEEDBACK_KIND_LABEL[FORM_KIND]||FORM_KIND,
          page:feedbackPage()
        })});
      if(!r.ok)throw new Error('HTTP '+r.status);
      showSentCountdown();
    }catch(e){
      alert(zh?'发送失败了（网络或服务端问题）。\n\n内容还在框里，没有丢。'
             :'Sending failed (network or server).\n\nYour text is still in the box.');
    }
    return;
  }
  /* 没有端点 —— 诚实降级，绝不假装已送达 */
  let copied=false;
  try{await navigator.clipboard.writeText(t);copied=true;}catch(e){}
  alert((zh
    ?'自动发送还没接通，这条内容没有被送出。\n\n'
     +(copied?'内容已复制到剪贴板，':'请手动复制文本框里的内容，')
     +'麻烦发到：\n'+MAIL+'\n\n抱歉，这是我的问题，不是你的。'
    :'Automatic sending is not wired up yet — this message was NOT sent.\n\n'
     +(copied?'Your text has been copied to the clipboard. ':'Please copy the text from the box. ')
     +'Please email it to:\n'+MAIL+'\n\nSorry — this one is on me.'));
};

828/3eac665136014e1bbe060ef94f7b90a3/c.html","dt":"2026-08-28","rg":"全国"},{"c":"si","t":"受权发布丨中华人民共和国医疗保障法","s":"新华社受权全文发布《中华人民共和国医疗保障法》，共7章56条，自2027年1月1日起施行。","b":["新华社北京8月28日电 《中华人民共和国医疗保障法》（2026年8月28日第十四届全国人民代表大会常务委员会第二十四次会议通过）。","第一条明确立法目的为维护公民医疗保障合法权益，健全多层次全民医疗保障体系。第五十六条规定本法自2027年1月1日起施行。"],"src":"新华网","url":"https://www.news.cn/politics/20260828/dd01defc94094099a85edeacd6a268fb/c.html","dt":"2026-08-28","rg":"全国"},{"c":"si","t":"自治区人力资源和社会保障厅 财政厅 医疗保障局 国家税务总局宁夏回族自治区税务局关于2026年度社会保险缴费基数有关问题的通知","s":"宁夏明确2026年城镇职工社保缴费基数8371元/月，下限5023元、上限25113元。","b":["2026年全区城镇职工社会保险缴费基数（含长期护理保险）为8371元/月，缴费基数下限5023元/月，缴费基数上限25113元/月。","个体工商户及灵活就业人员可在5023元至25113元/月之间自主选择缴费基数。"],"src":"宁夏人社厅","url":"https://hrss.nx.gov.cn/xxgk/zcj/zcfg/shbz/202608/t20260828_5325572.html","dt":"2026-08-28","rg":"宁夏"},{"c":"ai","t":"2026年上半年数字产业收入超20万亿元","s":"工业和信息化部公布运行情况：2026年上半年数字产业收入20.71万亿元，同比增长13.6%，人工智能需求增长和出口增势共同拉动产业盈利改善。","b":["日前，工业和信息化部发布2026年上半年我国数字产业运行情况。","上半年数字产业实现收入20.71万亿元，同比增长13.6%；实现利润总额1.79万亿元，同比增长19.3%。","报告称，人工智能等新领域新赛道发展动能增强，数字基础设施也持续优化升级。"],"src":"新华网（来源：工业和信息化部）","url":"https://www.news.cn/tech/20260827/366d796e0ca947ef99dfd65d412ea530/c.html","dt":"2026-08-27","rg":"全国"},{"c":"ai","t":"我国首次实现地月双向高速激光通信","s":"我国在超过40万公里的地月距离上建立双向激光链路，初步实现上行1.25Mbps、下行100Mbps通信速率。","b":["记者从中国科学院空间应用工程与技术中心获悉，我国地月激光通信试验任务取得重要突破。","科研团队解决远距离瞄准、弱信号探测和高速传输等难题，首次实现地月双向高速激光通信。","此次试验初步实现上行1.25Mbps、下行100Mbps，为载人登月、月球科研站建设和深空探测提供新手段。"],"src":"新华网（来源：科技日报）","url":"https://www.news.cn/tech/20260827/ed017277df184fe9ad7d10df5364172e/c.html","dt":"2026-08-27","rg":"全国"},{"c":"ai","t":"新华读报｜乌兰察布跻身中国AI算力重镇","s":"自2016年以来，内蒙古乌兰察布已有约百座数据中心落成或开工建设，跻身亚洲增长速度较快的算力集群。","b":["《参考消息》8月26日刊发文章，介绍乌兰察布在中国人工智能热潮中的算力发展。","自2016年以来，当地已有约百座数据中心落成或开工建设。","报道显示，多项大型项目落地使乌兰察布成为观察中国AI算力发展的窗口。"],"src":"新华网（来源：《参考消息》）","url":"https://www.news.cn/tech/20260827/9f02329a121d40b9b232eb8cfed24b75/c.html","dt":"2026-08-27","rg":"内蒙古乌兰察布"},{"c":"ai","t":"工业和信息化部：探索人工智能应用场景培育新模式","s":"工业和信息化部表示，“十五五”时期人工智能应用重在挖掘落地场景，探索“一业一图谱、一景一档案”的培育模式。","b":["8月26日，工业和信息化部副部长在国务院新闻办新闻发布会上介绍人工智能应用工作。","“十五五”时期，人工智能应用将更加注重场景挖掘和实际落地。","相关部门将探索“一业一图谱、一景一档案”的场景培育新模式。"],"src":"新华网（来源：国务院新闻办）","url":"https://www.news.cn/tech/20260827/a6da01e222bc4e289838fbd207e88d03/c.html","dt":"2026-08-27","rg":"全国"},{"c":"ai","t":"AI赋能丨AI让好医生“无处不在”","s":"科技日报记者随广西“人工智能赋能千行百业一线调研行”走进广西医科大学第一附属医院，医院演示自主研发的“泌语医谈”AI交互式医疗智能体。","b":["8月24日，科技日报记者随广西“人工智能赋能千行百业一线调研行”采访活动走进广西医科大学第一附属医院。广西医科大学第一附属医院在读博士杨剑文向大家操作演示了“泌语医谈”AI交互式医疗智能体。只见他在问诊屏幕录入泌尿外科相关病症后，将系统语言切换至越南语模式，数字人随即以流利的越南语逐条追问症状，并生成了专业的诊疗建议。","该智能体是医院自主研发的泌尿外科AI交互式医疗问答智能体，初衷是解决语言不通的问诊难题。该院每年接诊大量东盟国家患者，智能体投入使用后，跨境沟通障碍得以消除。知识骨架来源于超过120万字的权威临床案例，内化387种典型疾病场景。"],"src":"科技日报","url":"https://www.stdaily.com/web/gdxw/2026-08/27/content_570392.html","dt":"2026-08-27","rg":"地方"},{"c":"ai","t":"机器人拥有一双“手”之后，会变怎样？","s":"新华社关注人形机器人灵巧手的发展：机器人制造的难点正在从能行动走向能精准操作。","b":["“手”是机器人制造中的难点。","新华社在第二届世界人形机器人运动会期间观察中国机器人灵巧手等技术进展。","从运动场到产业现场，机器人的精细操作能力正在成为具身智能落地的重要一环。"],"src":"新华网","url":"https://www.news.cn/tech/20260826/6e90d2a8f2ef47518657f1e1f4f73a04/c.html","dt":"2026-08-26","rg":"北京"},{"c":"ai","t":"共育机器人产业创新生态 税惠支持政策持续加力","s":"新华社走访机器人企业和税务部门，关注研发费用加计扣除、高新技术企业所得税等政策如何支持产业创新。","b":["第二届世界人形机器人运动会举办期间，记者走访多家参展参赛企业。","机器人企业可享受研发费用加计扣除、高新技术企业所得税优惠等多重政策支持。","税惠政策正在降低研发和经营成本，助力构建更健康的机器人产业运营生态。"],"src":"新华网","url":"https://www.news.cn/tech/20260826/83720573cc374f7eabf2b247c1b15d33/c.html","dt":"2026-08-26","rg":"北京"},{"c":"ai","t":"国家数据局：规范开展公共数据授权运营","s":"国家数据局表示将推动各地区各部门规范开展公共数据授权运营，公共数据正成为人工智能技术创新的重要支撑。","b":["国家数据局8月25日介绍公共数据授权运营工作进展。","当前人工智能演进呈现数据驱动特征，公共数据资源具有规模大、质量好和带动作用强等特点。","全国已有25个省区市实质性开展授权运营，相关部门将加强信息披露监督管理。"],"src":"新华网（来源：国家数据局）","url":"https://www.news.cn/tech/20260826/b86f9941bf1a45bbb136cb35274fc2ea/c.html","dt":"2026-08-26","rg":"全国"},{"c":"ai","t":"智能产业驶入发展快车道","s":"人工智能与实体经济深度融合，机器人出口扩大，工业机器人产量前7个月同比增长28.5%。","b":["装配机器人捕捉毫米级误差，eVTOL（电动垂直起降飞行器）穿梭在楼宇之间，智能体自主拆解复杂决策……当前，人工智能与实体经济持续深度融合，产业变革多线并进。从算力芯片、工业智能装备到低空通航体系，技术创新持续打通落地堵点，全方位推动制造、服务等领域转型升级。","2026年以来，我国机器人出口规模持续扩大，品类结构不断优化。今年前7个月，我国机器人产量持续增长，其中工业机器人产量同比增长28.5%，出口金额达到73.4亿元、同比增长13.2%；上半年，清洁机器人、智能仿生机器人合计出口180.9亿元，工业机器人销往141个国家和地区。"],"src":"新华网","url":"https://www.news.cn/tech/20260826/5d6478f8c6774822831852b335541df1/c.html","dt":"2026-08-26","rg":"全国"},{"c":"ai","t":"我国已成功研制近200项人工智能关键标准","s":"工业和信息化部副部长辛国斌在国新办发布会上表示，我国人工智能已基本贯穿研发设计、生产制造、质检运维等全链条，近200项人工智能关键标准已成功研制，并正在组织多个城市开展人工智能伦理审查与服务实践。","b":["新华社北京8月26日电 工业和信息化部副部长辛国斌8月26日在国新办举行的“开局起步‘十五五’”系列主题新闻发布会上说，从应用上看，我国人工智能已经基本贯穿研发设计、生产制造、质检运维等全链条。","已有近200项人工智能关键标准成功研制，正在组织多个城市开展人工智能伦理审查与服务实践。"],"src":"新华社","url":"https://www.news.cn/20260826/35f1865aed8e4f8dbc1217d374a42eed/c.html","dt":"2026-08-26","rg":"全国"},{"c":"ai","t":"我国发布第五批50个公共数据“跑起来”示范场景","s":"国家数据局25日发布第五批共50个公共数据“跑起来”示范场景。","b":["国家数据局25日在京举行“数据价值化 我们在行动”第五场新闻发布会，会上发布了第五批共50个公共数据“跑起来”示范场景。至此，我国已累计发布五批共150个示范场景，公共数据资源开发利用取得阶段性成效。","下一步，国家数据局将以示范场景建设为牵引，推动重点行业领域公共数据资源开发利用。"],"src":"新华网","url":"http://www.news.cn/tech/20260826/a4a510beabd446a1a48b8e19dce02246/c.html","dt":"2026-08-26","rg":"全国"},{"c":"si","t":"人大常委会丨医疗保障法草案三审稿加强参保人权益保障","s":"新华社报道，医疗保障法草案8月25日提请全国人大常委会三次审议。三审稿增加国家建立健全长期护理保险制度，明确困难群体参加居民医保个人缴费按规定资助，并细化异地就医费用及时足额直接结算。","b":["新华社北京8月25日电（记者彭韵佳、李恒）医疗保障法草案25日提请全国人大常委会会议三次审议。草案三审稿增加长期护理保险等内容，进一步加强参保人权益保障。","草案三审稿增加规定，国家建立健全长期护理保险制度。长期护理保险的筹资运行、待遇保障、基金使用、监督管理等的具体办法，由国务院医疗保障行政部门会同国务院有关部门参照本法有关基本医疗保险的规定制定。草案三审稿增加规定，特困人员、最低生活保障家庭成员、符合条件的防止返贫致贫对象等参加城乡居民基本医疗保险的，其个人缴费部分按照规定给予资助。草案三审稿还进一步细化异地就医医药费用结算要求，增加规定，异地就医的参保人员在定点医药机构发生的医药费用中应当由医疗保障基金支付的部分，医疗保障经办机构应当按照规定审核后及时足额直接结算并拨付。"],"src":"新华社","url":"https://www.news.cn/politics/20260825/2dfe74a3cb304844b0866e0434d24e9f/c.html","dt":"2026-08-25","rg":"全国"},{"c":"ai","t":"链接芯片与场景——AI智能基座加速端侧应用落地","s":"AI智能基座将芯片、操作系统和端侧应用集成，加速手机、汽车、具身智能等场景落地。","b":["当前，人工智能正加快融入生产生活各个环节。推动这场智能化变革的，不仅有云端算力、大模型与芯片的进步，也有一个悄然崛起的产业——AI智能基座，它将芯片、操作系统和端侧AI应用集成为全栈解决方案。记者调研发现，AI智能基座正成为人工智能技术在手机、汽车、具身智能、穿戴设备等消费端场景落地，开发端侧AI新产品的加速器。","“人工智能技术涉及的‘芯、算、用’，今年行业普遍将目光聚焦在端侧AI的应用落地，这也是今年世界人工智能大会给我的最大感受。”中关村智用人工智能研究院院长孙明俊说。"],"src":"新华网","url":"https://www.news.cn/tech/20260825/402ae2d97b83468186deae5e00afe4d2/c.html","dt":"2026-08-25","rg":"全国"},{"c":"ai","t":"AI解码人类基因关键DNA“起始子”序列特征","s":"美国加州大学圣迭戈分校研究人员利用高通量DNA测序和人工智能技术，解码了人类基因中一段名为“起始子”的关键DNA序列特征。","b":["美国加州大学圣迭戈分校研究人员利用高通量DNA测序和人工智能技术，解码了人类基因中一段名为“起始子”的关键DNA序列特征。这项成果为解析基因表达调控规律和预测DNA突变影响提供了新工具。相关论文发表于最新一期《基因与发育》杂志。","研究人员利用高通量DNA测序技术，检测了约50万个不同“起始子”序列的基因表达活性，随后将这些实验数据用于训练机器学习模型。利用训练出的模型，发现约60%的人类基因含有“起始子”。"],"src":"科技日报","url":"http://www.news.cn/tech/20260825/ae394483517640f59eb35598547b2bd2/c.html","dt":"2026-08-25","rg":"全国"},{"c":"ai","t":"算力全链条绿色化成效初显 词元经济等成新增长极","s":"绿色算力大会披露：智能算力2185EFLOPS，词元经济、算力网和算力出海成为新增长极。","b":["记者从日前召开的2026绿色算力（人工智能）大会上获悉，当前我国算力规模快速增长。","截至2026年6月底，我国智能算力规模达2185EFLOPS。","截至2026年3月，我国日均词元调用量从2024年初约1000亿激增至约140万亿。"],"src":"新华社","url":"http://www.news.cn/tech/20260824/ddb9796414604470a9af77c749174cef/c.html","dt":"2026-08-24","rg":"全国"},{"c":"si","t":"单位职工缴纳城镇养老保险的基数是多少？","s":"上海市人社局登记缴费问答明确：职工当年个人缴费基数按本人上年月平均工资性收入确定。2026年7月1日起，本市社保缴费基数上限调整为37731元/月，下限调整为7546元/月。","b":["职工当年个人缴费基数按本人上年月平均工资性收入确定。首次参加工作和变动工作单位的缴费个人，应按新进单位首月全月工资性收入确定月缴费基数。","关于首月未足额发放全月工资的缴费工资基数确定：缴费基数按该职工当月实际工资性收入核定（下限按上年城镇单位就业人员月平均工资60%核定），在用人单位和职工双方协商一致的情况下，亦可按全月工资性收入为月缴费基数。次月起单位仍应按该职工全月工资性收入作为缴费基数并为其申报缴费基数调整。2026年7月1日起，本市社保缴费基数的上限调整为37731元/月,下限调整为7546元/月。"],"src":"上海市人力资源和社会保障局","url":"https://rsj.sh.gov.cn/tdjjf_17554/20260824/t0035_1443297.html","dt":"2026-08-24","rg":"上海"},{"c":"si","t":"市人社局 市医保局 市税务局关于公布2025年度全市职工平均工资及2026年度工资福利待遇标准等有关问题的通知","s":"天津公布2025年职工月平均工资8634元，2026年社保缴费基数最低5180元、最高25902元。","b":["天津明确，2025年度本市职工年平均工资为103608元，月平均工资为8634元。2026年度工伤保险和防暑降温费等待遇标准按本市职工月平均工资8634元计算，自2026年1月1日起执行。","用人单位及其职工缴纳职工基本养老、职工基本医疗（含生育保险）、失业、工伤保险费基数最低和最高标准分别为5180元和25902元。"],"src":"天津市人社局","url":"https://tianjin.chinatax.gov.cn/11200000000/0300/030004/03000419/20260824171546537.shtml","dt":"2026-08-24","rg":"天津"},{"c":"ai","t":"2026绿色算力（人工智能）大会：算得快、用得省","s":"新华社报道绿色算力大会：截至2026年6月底全国智能算力达2185EFLOPS，产业重心从拼规模转向拼能效。","b":["8月22日，2026绿色算力（人工智能）大会在内蒙古自治区呼和浩特市召开。","截至2026年6月底，我国智能算力规模达2185EFLOPS。","八大国家算力枢纽智算规模占全国智算规模的80%以上。"],"src":"新华社","url":"http://www.news.cn/tech/20260823/dbacd8a12eaa48c8b71c5c1fbb0f39ce/c.html","dt":"2026-08-23","rg":"全国"},{"c":"ai","t":"特稿｜世界机器人大会成全球观察中国“机”遇窗口","s":"2026世界机器人大会在北京亦庄举行，会上披露上半年中国人形机器人出货量超4万台、全球占比97%。","b":["北京亦庄，2026世界机器人大会上，各类机器人生动诠释着“科幻照进现实”的图景。","8月19日，宇树科技机器人在2026世界机器人大会开幕式前表演。","2026年上半年，中国人形机器人出货量已超4万台，全球占比进一步提升至97%。"],"src":"新华社","url":"https://www.news.cn/tech/20260822/3a77fd23ae66475982ab8ca3b31272c7/c.html","dt":"2026-08-22","rg":"北京"},{"c":"si","t":"2026年全国医疗保障工作年中座谈会在湖南召开","s":"国家医保局在湖南召开2026年全国医疗保障工作年中座谈会，总结上半年工作并部署下半年。会议提到落实参保长效机制、住院分娩零自付、生育津贴直发、推进长护险、印发《全民医疗保障“十五五”规划》等。","b":["2026年8月22日，全国医疗保障工作年中座谈会在湖南长沙召开。会议总结2026年上半年医保工作，部署下一步医保工作。","会议指出，全面落实基本医保参保长效机制，参保规模保持稳定、参保结构持续优化。逐步健全筹资和待遇保障机制。不断优化生育保险制度，推进实施政策范围内住院分娩个人“零自付”、实现生育津贴按程序直接发放给个人。有序推行长期护理保险，着力推进《关于加快建立长期护理保险制度的意见》落实。高效落实医保支付和结算机制，开展医保基金与定点医药机构即时结算。稳步提升医保经办管理服务水平。推进真实世界医保综合价值评价研究，印发《全民医疗保障“十五五”规划》。"],"src":"国家医疗保障局","url":"http://www.nhsa.gov.cn/art/2026/8/22/art_14_21885.html","dt":"2026-08-22","rg":"全国"},{"c":"si","t":"湖南省人力资源和社会保障厅 国家税务总局湖南省税务局关于公布2026年社会保险缴费基准值的通知","s":"湘人社规〔2026〕14号公布：2025年全省全口径城镇单位就业人员月平均工资6843元。2026年1月1日至12月31日，职工基本养老保险、工伤保险、失业保险缴费基准值6843元/月，缴费基数上限20529元/月、下限4106元/月。2026年12月31日前完成差额补缴的不计征滞纳金。","b":["湘人社规〔2026〕14号。根据湘政办发〔2019〕19号相关规定，按照省统计局提供的数据计算，2025年本省全口径城镇单位就业人员月平均工资为6843元。现就2026年职工基本养老保险、工伤保险、失业保险缴费基准值等有关事项通知如下：","一、2026年1月1日至12月31日，全省三项社会保险的缴费基准值调整为6843元/月。二、全省三项社会保险的缴费基数上限调整为20529元/月，下限调整为4106元/月。三、因2026年度缴费基数上下限标准调整产生的社会保险费差额，参保单位和参保个人在2026年12月31日前完成差额补缴的，不影响个人权益记录，不计征滞纳金。以上规定自公布之日起执行，有效期为1年。湖南省人力资源和社会保障厅 国家税务总局湖南省税务局 2026年7月24日"],"src":"湖南省人力资源和社会保障厅","url":"https://rst.hunan.gov.cn/rst/xxgk/zcfg/zxzc/202608/t20260822_34049202.html","dt":"2026-08-22","rg":"其他市"},{"c":"si","t":"关于公布2026年社会保险缴费基准值的通知的解读","s":"湖南省人社厅解读：2026年三项社保缴费基数上限20529元/月、下限4106元/月，适用2026年1月1日至12月31日。灵活就业人员可在4106元至20529元之间选择企业职工基本养老保险缴费基数。","b":["2026年全省三项社会保险的缴费基数上限调整为20529元/月，下限调整为4106元/月，适用时间为2026年1月1日至12月31日。","以个人身份参保的个体工商户、灵活就业人员参加企业职工基本养老保险的，可以在缴费基准值的60%至300%之间选择适当的缴费基数。今年我省灵活就业人员可在4106元和20529元之间选择适当的缴费基数。因缴费基准值调整产生的补差部分，参保单位和参保个人在2026年12月31日前完成差额补缴的，不影响个人权益记录，不计征滞纳金。"],"src":"湖南省人力资源和社会保障厅","url":"https://rst.hunan.gov.cn/rst/xxgk/zcfg/zcjd/202608/t20260822_34049203.html","dt":"2026-08-22","rg":"其他市"},{"c":"ai","t":"科学与健康丨从“工具”到“搭档” AI应怎样助力科研","s":"8月21日至22日，2026科学智能大会在北京举办。人工智能驱动的科学研究（AI for Science，AI4S）成为热议话题。","b":["8月21日至22日，2026科学智能大会在北京举办。作为驱动原始创新、重塑科研范式的核心引擎，人工智能驱动的科学研究（AI for Science，AI4S）成为热议话题。","当前，AI4S底层基础设施逐步完善，科研智能体与自主科研系统实现跨越式进展。今年3月发布的《AI for Science创新图谱2026》显示，近五年全球相关论文发表量增长了一倍多，航空航天、量子科技、材料科学等领域年均增速超过30%。"],"src":"新华社","url":"https://www.news.cn/tech/20260822/d8084713b4a444348bc435efdd100c2d/c.html","dt":"2026-08-22","rg":"全国"},{"c":"si","t":"关于2026年度各项社会保险缴费工资基数上下限的通告","s":"北京市人力资源和社会保障局、北京市医疗保障局、国家税务总局北京市税务局联合通告，自2026年7月起确定本市职工基本养老保险等各项社会保险月缴费基数上下限。个人身份参保人员可在上下限间选择基数，并明确补差相关规定。","b":["京人社发〔2026〕7号","为确保本市参保单位和参保个人按时足额缴纳2026年度社会保险费，现就各项社会保险缴费工资基数上下限通告如下：","一、自2026年7月起，本市2026年度职工基本养老保险、失业保险、工伤保险、职工基本医疗保险（含生育）月缴费基数上限确定为36348元，月缴费基数下限为7270元。","二、自2026年7月起，在市、区人力资源公共服务中心等社会保险代理机构以个人身份存档，且参加职工基本养老保险、失业保险的个人，以及在各街道（乡镇）便民服务中心参加职工基本养老保险、失业保险的个人，可在7270元和36348元之间选择月缴费基数。","1.如按照职工基本养老保险、失业保险月缴费基数上限36348元核算，参保个人月缴纳职工基本养老保险费7269.6元，月缴纳失业保险费363.48元。","2.如按照职工基本养老保险、失业保险月缴费基数下限7270元核算，参保个人月缴纳职工基本养老保险费1454元，月缴纳失业保险费72.7元。","三、自2026年7月起，在市、区人力资源公共服务中心等社会保险代理机构以个人身份存档，且参加职工基本医疗保险的个人，以及在各街道（乡镇）便民服务中心参加职工基本医疗保险的个人，月缴纳职工基本医疗保险费593.68元。","四、因2026年度缴费基数上下限标准调整产生的社会保险费差额，参保单位和参保个人在2026年12月底前完成差额补缴的，不影响个人权益记录，参保单位不计征滞纳金。","特此通告。","北京市人力资源和社会保障局","北京市医疗保障局","国家税务总局北京市税务局","2026年8月20日"],"src":"北京市人力资源和社会保障局","url":"https://rsj.beijing.gov.cn/xxgk/2024zcwj/202608/t20260821_4831461.html","dt":"2026-08-21","rg":"北京"},{"c":"si","t":"本市发布2026年各项社保缴费工资基数上下限","s":"北京市人力资源和社会保障局等单位发布通告，明确从2026年7月起本市职工基本养老保险等月缴费基数上限为36348元、下限为7270元。个人身份参保相关缴费标准及补差安排同步明确。","b":["8月21日，北京市人力资源和社会保障局、北京市医疗保障局、国家税务总局北京市税务局联合发布《关于2026年度各项社会保险缴费工资基数上下限的通告》，明确从2026年7月起，凡在本市参保的职工基本养老保险、失业保险、工伤保险、职工基本医疗保险（含生育保险）的月缴费基数上限为36348元，下限为7270元。","在市、区人力资源公共服务中心等社会保险代理机构以个人身份存档，且参加职工基本养老保险、失业保险的个人，以及在各街道（乡镇）便民服务中心参加职工基本养老保险、失业保险的个人，缴费基数可在企业职工养老保险缴费基数下限和上限之间选择。其中，选择上限的每月缴纳职工基本养老保险费7269.6元，失业保险费363.48元，选择下限的每月缴纳职工基本养老保险费1454元，失业保险费72.7元。如在上限和下限之间自主选择缴费基数，职工基本养老保险按缴费基数的20%缴纳，失业保险费按缴费基数的1%缴纳。上述个人参加职工基本医疗保险的每月缴纳职工基本医疗保险费593.68元。","此外，参保单位及其职工因缴费基数上下限调整产生的补差金额将在2026年9月处理生成，无需单位申报。在2026年12月底前完成补缴的单位，不计征滞纳金。以个人身份参保的人员已按低于2026年缴费基数下限标准缴费的需补差，无需申报调整缴费基数；已按2025年缴费基数上限标准缴费的，且有意愿按2026年度上限标准缴费的，需向税务部门重新申报月缴费基数并补差。在2026年12月25日前完成补缴的个人视为按时足额缴纳，不影响个人权益记录。"],"src":"北京市人力资源和社会保障局","url":"https://www.beijing.gov.cn/zhengce/zcjd/202608/t20260821_4831683.html","dt":"2026-08-21","rg":"北京"},{"c":"si","t":"政策解读《关于2026年度各项社会保险缴费工资基数上下限的通告》","s":"北京市人社局解读2026年度社保缴费基数通告：五险月缴费基数上限36348元、下限7270元。个人身份参保养老失业可在区间自选，医保月缴593.68元；7月起按新标准执行，差额9月系统生成、12月31日前补缴不计滞纳金。","b":["通告主要是公布了2026年度各项社会保险缴费工资基数上下限，为参保单位和参保个人提供了明确的社会保险缴费标准。从2026年7月开始，本市2026年度职工五险月缴费基数上限和下限分别为36348元和7270元。","从2026年7月开始，在本市以个人身份参加职工养老保险、失业保险的人员，月缴费基数可在7270元和36348元之间选择。从2026年7月开始，在本市以个人身份参保的人员，每月需缴纳的职工基本医疗保险费用为593.68元。对已按2025年度社会保险缴费基数上下限标准缴纳的社会保险费，因按2026年度缴费基数上下限标准调整产生的补差部分，在2026年12月底前完成补收金额缴纳的，不影响个人权益记录，参保单位不计征滞纳金。"],"src":"北京市人力资源和社会保障局","url":"https://rsj.beijing.gov.cn/xxgk/2024zcjd/202608/t20260821_4831476.html","dt":"2026-08-21","rg":"北京"},{"c":"ai","t":"交通需求与人工智能技术加速对接","s":"交通运输，人工智能规模化应用的重要阵地之一。","b":["无人车穿梭于城市街巷，担当物流配送“新运力”；无人机盘旋于长江上空，成为巡检“空中尖兵”；机器人入驻快递处理中心，变身流水线“分拣员”。","今年6月，交通运输部等5部门联合印发的《“人工智能+交通运输”典型应用场景创新行动方案》提出，到2030年，涌现一批“人工智能+交通运输”新基础设施、新技术装备、新服务模式、新产业形态。"],"src":"人民日报","url":"https://www.gov.cn/zhengce/202608/content_7078753.htm","dt":"2026-08-21","rg":"全国"},{"c":"ai","t":"抢占人工智能产业应用制高点","s":"北京、上海、深圳等地推动人工智能产业发展，2026年相关产业预计增速超30%。","b":["一段时间以来，北京、上海、深圳等地积极采取举措，因地制宜，推动人工智能产业发展。数据显示，2025年我国人工智能相关产业规模超过万亿元，2026年预计增速超30%，在生产、服务、民生和政务四大领域已初步形成商业化规模化应用体系。","在生产领域，人工智能加速驱动制造业全链条智能化变革。例如，今年7月份举办的2026世界人工智能大会展示了具身智能机器人在汽车线束工厂环形流水线的应用，多台机器人组成作业集群，连续完成取线、布线、插接等柔性装配工序。"],"src":"新华网","url":"http://www.xinhuanet.com/tech/20260820/a3bd93dc243f4c0d96ca9213b48e4347/c.html","dt":"2026-08-20","rg":"全国"},{"c":"si","t":"新华鲜报丨未来五年，医疗保障这样提质增效","s":"国家医保局公布《全民医疗保障“十五五”规划》，明确到2030年增强基本医保可及性、巩固基金安全和提升使用效能，长护险将覆盖所有统筹地区。","b":["一份关系13亿多参保人的医疗保障蓝图，正式绘就。","8月19日，国家医保局公布《全民医疗保障“十五五”规划》，明确未来五年目标：到2030年，基本医保公共服务可及性进一步增强，医保安全保障能力巩固提升，医保基金使用效能进一步提升。","作为专项制度安排，长期护理保险单独部署实施。规划明确到2030年，长期护理保险制度将覆盖所有统筹地区。"],"src":"新华社","url":"https://www.news.cn/20260819/01eb6e94c8794f9d91ff35f26229649b/c.html","dt":"2026-08-19","rg":"全国"},{"c":"si","t":"国家医疗保障局关于印发《全民医疗保障“十五五”规划》的通知","s":"国家医保局印发《全民医疗保障“十五五”规划》，要求认真贯彻执行。规划提出到2030年全面建成覆盖全民、统筹城乡、公平统一、安全规范、可持续的多层次医疗保障体系。","b":["各省、自治区、直辖市及新疆生产建设兵团医疗保障局：《全民医疗保障“十五五”规划》已经国家医保局党组会议审议通过，现印发给你们，请认真贯彻执行。","国家医疗保障局 2026年7月27日（主动公开）。规划根据《中华人民共和国国民经济和社会发展第十五个五年规划纲要》制定，提出全面建成覆盖全民、统筹城乡、公平统一、安全规范、可持续的多层次医疗保障体系。"],"src":"国家医疗保障局","url":"https://www.nhsa.gov.cn/art/2026/8/19/art_53_21828.html","dt":"2026-08-19","rg":"全国"},{"c":"si","t":"《全民医疗保障“十五五”规划》解读","s":"国家医保局解读《全民医疗保障“十五五”规划》：发展目标设8项主要指标，新增长期护理保险覆盖统筹地区数量、基金结余可支付月数、即时结算覆盖率、生育津贴直发等。到2029年基本医保基本实现省级统筹，到2030年长护险覆盖所有统筹地区。","b":["“十五五”规划主要考虑基于“十四五”成就，展望人口结构变化、医药创新和健康需求升级。发展目标中设8个主要指标，针对性新增了长期护理保险制度覆盖统筹地区数量、职工和城乡居民基本医疗保险统筹基金累计结余可支付月数、即时结算基本医疗保险基金支出覆盖率、生育津贴直接发放到个人等指标。","健全多层次医疗保障体系：坚持基本医保主体地位，完善筹资机制、待遇清单，报销政策向基层倾斜，到2029年基本实现省级统筹。推行长期护理保险，到2030年覆盖所有统筹地区。深化支付方式改革，推进医药价格改革与集中采购，维护医保基金安全，提升医保经办管理与服务。"],"src":"国家医疗保障局","url":"https://www.nhsa.gov.cn/art/2026/8/19/art_105_21829.html","dt":"2026-08-19","rg":"全国"},{"c":"ai","t":"新系统让机器人具备真实世界中自主执行任务能力","s":"成都人形机器人创新中心发布全球首个复杂语言指令集全自主（无遥控）超长视野机器人任务执行系统，相关技术已取得发明专利授权。","b":["18日，记者从成都人形机器人创新中心获悉，该中心发布了全球首个复杂语言指令集全自主（无遥控）超长视野机器人任务执行系统，解决了机器人在陌生环境无法自主完成决策规划的难题，让机器人摆脱实验室的“预设摆拍”，走进复杂多变的真实场景中。相关技术已取得发明专利授权。","该执行系统的核心价值不在于堆叠了多少模型，而在于建立了从任务理解到技能选择再到动作执行的完整闭环，让机器人真正具备了在陌生环境中自主完成长时序任务的能力。"],"src":"科技日报","url":"http://www.xinhuanet.com/tech/20260819/2e4a10ba3c1c4381924804b7b61f87ef/c.html","dt":"2026-08-19","rg":"地方"},{"c":"si","t":"本市调整2026年度社保缴费基数上下限","s":"上海市人力资源和社会保障局公布，2026年7月1日起本市社保缴费基数上限调整为37731元/月，下限调整为7546元/月。补差部分应在2026年9月底前缴纳，期间免收滞纳金。","b":["按照有关规定及要求，2026年7月1日起，本市社保缴费基数的上限调整为37731元/月，下限调整为7546元/月。本市2025年度全口径城镇单位就业人员平均工资为12577元/月。","为确保参保人员社保权益，社保缴费基数上下限公布后，参保单位及其职工因缴费基数调整产生的社会保险费补差部分，应在2026年9月底前缴纳，期间免收滞纳金。灵活就业参保缴费人员清算补缴完成时限参照上述时间执行。"],"src":"上海市人力资源和社会保障局","url":"https://rsj.sh.gov.cn/tgsgg_17341/20260818/t0035_1443203.html","dt":"2026-08-18","rg":"上海"},{"c":"ai","t":"人工智能激活力 “新”意盎然促发展","s":"今年以来，以高端制造、数智经济、现代服务为代表的新动能对上半年经济增长的贡献率超过四成。新动能中，人工智能相关产业表现尤为突出。","b":["今年以来，“新”成为我国经济发展的关键词，以高端制造、数智经济、现代服务为代表的新动能对上半年经济增长的贡献率超过四成。新动能中，人工智能相关产业表现尤为突出。","在大庆油田，一场“指尖采油”的数智化转型正在火热开展。大庆油田勘探开发研究院二级工程师朱吉军告诉记者，“‘油博士’大模型是我们为油田打造的‘智慧大脑’。通过打造行业大模型与‘四模合一’智算引擎，将海量数据与专家经验转化为可复用、可推理的数字资产。”"],"src":"新华网","url":"https://www.news.cn/tech/20260814/1fb411406b8d4dd6bff1879fa44d6fcd/c.html","dt":"2026-08-14","rg":"全国"},{"c":"ai","t":"“AI+汽车”应用再上大台阶","s":"当前，人工智能（AI）正在汽车领域加速应用，推动汽车从单一交通工具向“智能终端”和“移动生活空间”演进。","b":["当前，人工智能（AI）正在汽车领域加速应用，推动汽车从单一交通工具向“智能终端”和“移动生活空间”演进。近期，我国牵头制定的联合国自动驾驶系统全球技术法规获批发布，标志着中国智能驾驶产业迈入全新发展阶段。","华为、腾讯、字节等科技巨头正积极布局，与主流车企加强合作，推动AI深度赋能汽车产业，重塑汽车行业格局。"],"src":"新华网","url":"http://www.xinhuanet.com/tech/20260812/b78dcbcf6fe0419ea3de34bdfb539f49/c.html","dt":"2026-08-12","rg":"全国"},{"c":"ai","t":"具身智能，在物理世界中成长","s":"“十五五”规划纲要把具身智能列为未来产业之一。中国工程院院士郑南宁解读具身智能如何从实验室走向生产线与行业场景，在物理世界中持续交互、学习与进化。","b":["“十五五”规划纲要把具身智能列为未来产业之一。从实验室走向生产线、再走向更复杂的行业场景，人工智能正在经历一场重要转变，发展为能够在物理世界中持续交互、学习与进化的智能形态——具身智能。","需要明确的是，具身智能不等于人形机器人，人形只是载体之一。其关键在于智能系统能否真正进入真实环境，形成“感知—认知—决策—行动—反馈”的闭环，并在这一闭环中不断调整自身行为，并通过学习改善内部模型和策略。"],"src":"新华网","url":"http://www.news.cn/tech/20260808/02480c2b77f54347bab741d7827c738b/c.html","dt":"2026-08-08","rg":"全国"},{"c":"ai","t":"从数据采集到应用场景，在上海感受具身智能发展活力","s":"新华社走访上海具身智能企业：机器人通过数据采集和反复训练，进入家政、零售、分拣和产线等真实场景。","b":["记者近日探访上海具身智能企业，观察机器人完成家政、零售、分拣和产线作业等学习任务。","通过机器人数据采集员一次次“手把手”教学，机器人的AI能力不断进化。","具身智能正从实验室走向真实生产生活，应用场景持续拓展。"],"src":"新华网","url":"https://www.news.cn/tech/20260806/73f56130fcec49ba96f46d5e3814251f/c.html","dt":"2026-08-06","rg":"上海"},{"c":"ai","t":"从追赶到领跑 中国开源模型深度融入实体经济","s":"中央广播电视总台报道，月之暗面将Kimi K3全量开源，总参数2.8万亿；中国开源模型下载量占全球41%。","b":["27日，月之暗面正式宣布将最新旗舰大模型Kimi K3全量开源，总参数达2.8万亿，是目前全球参数规模最大的开源大模型。","开源内容包括完整模型权重、技术报告，以及支撑模型训练的三项底层基础设施技术，全球开发者可免费下载和本地部署。","全球最大开源AI模型平台2026年春季报告显示，中国研发的开源模型下载量已占全球总量的41%；全球主流大模型调用榜单前六位全部来自中国团队。","我国开源模型累计下载量已突破100亿次，居全球首位；全球每10次大模型下载中，就有6次来自中国研发的模型。"],"src":"中央广播电视总台央视新闻","url":"https://news.cri.cn/20260729/f1ebd79e-0ca1-48de-a827-8aa1ca7b567a.html","dt":"2026-07-29","rg":"全国"},{"c":"ai","t":"这些智能网联汽车发展热点值得关注","s":"L2级组合驾驶辅助功能乘用车渗透率达70.5%，大算力智驾芯片、舱驾融合芯片加快迭代升级。","b":["新华社北京7月28日电 题：这些智能网联汽车发展热点值得关注","L2级组合驾驶辅助功能乘用车渗透率达70.5%，大算力智驾芯片、舱驾融合芯片加快迭代升级。日前在北京召开的2026世界智能网联汽车大会媒体圆桌会上，权威部门有关负责人、业内专家共话智能网联汽车发展新动向。"],"src":"新华网","url":"https://www.news.cn/fortune/20260728/f86ba7e880204855be8547f63e1a2560/c.html","dt":"2026-07-28","rg":"全国"},{"c":"ai","t":"工信部：深入推进“车路云一体化”生产准入和通行试点","s":"工业和信息化部将深入推进“车路云一体化”应用试点、生产准入和上路通行试点。","b":["在7月27日工业和信息化部举行的2026世界智能网联汽车大会媒体圆桌会上，工业和信息化部装备工业一司司长郭守刚表示，工业和信息化部将加快编制出台智能网联新能源汽车产业发展“十五五”规划，深入推进“车路云一体化”应用试点、生产准入和上路通行试点。","今年以来，L2级组合驾驶辅助功能乘用车渗透率达到70.5%，领航驾驶辅助（NOA）功能乘用车渗透率达到34.2%，首批L3级有条件自动驾驶车型开始在特定区域上路通行。"],"src":"新华网","url":"http://www.xinhuanet.com/tech/20260728/057db72877c646428daa9ed38fc8a6b7/c.html","dt":"2026-07-28","rg":"全国"},{"c":"ai","t":"2026世界智能网联汽车大会媒体圆桌会在北京召开","s":"7月27日，2026世界智能网联汽车大会媒体圆桌会在北京召开。","b":["7月27日，2026世界智能网联汽车大会媒体圆桌会在北京召开。工业和信息化部装备工业一司司长郭守刚，交通运输部科技司副司长翁优灵，北京市经济和信息化局副局长苏国斌等单位相关负责人和专家代表介绍有关情况并答记者问。","2026世界智能网联汽车大会由工业和信息化部、交通运输部、北京市人民政府联合主办，拟于2026年10月21日至23日在北京亦庄北人亦创国际会展中心举办。"],"src":"新华网","url":"http://www.news.cn/auto/20260727/d0731b53d90b48aba0cfa6c1a1456f12/c.html","dt":"2026-07-27","rg":"全国"},{"c":"si","t":"人力资源社会保障部举行例行新闻发布会","s":"上海市人社局转载人社部例行发布会：截至6月底全国基本养老、失业、工伤保险参保分别为10.76亿、2.49亿、3.23亿人，三项基金累计结余11.07万亿元。延迟退休改革总体平稳，下一步将完善转移接续、推进城乡居民基础养老金最低标准调整。","b":["截至6月底，全国基本养老保险、失业保险、工伤保险（含职业伤害保障）参保人数分别为10.76亿人、2.49亿人、3.23亿人，分别同比增加473万人、435万人、2283万人。1至6月，三项社会保险基金总收入4.88万亿元、总支出4.14万亿元，6月底累计结余11.07万亿元，基金运行总体平稳。延迟法定退休年龄改革总体平稳有序。完善并落实企业职工基本养老保险全国统筹制度。指导地方落实做好企业年金工作的意见，加力实施个人养老金制度。","下一步工作安排：进一步研究完善基本养老保险转移接续政策。健全多层次多支柱养老保险体系。鼓励支持灵活就业人员、新就业形态人员参加职工养老保险。推进城乡居民养老保险全国基础养老金最低标准调整，指导各地结合实际提高本地基础养老金标准。"],"src":"上海市人力资源和社会保障局","url":"https://rsj.sh.gov.cn/tgwyrsb_17088/20260724/t0035_1442690.html","dt":"2026-07-24","rg":"全国"},{"c":"si","t":"河南社保“第六险”来了 2028年全覆盖 重度失能最高报销70%","s":"河南分步推进长期护理保险，2026年底先覆盖全省就业人员，重度失能基金支付最高70%。","b":["7月22日，省政府新闻办召开新闻发布会，详细解读《河南省建立长期护理保险制度实施方案》。河南将分三步走，到2026年年底制度覆盖全省就业人员；到2028年实现全省参保全覆盖。","长护险基金不设起付线，按比例支付并设年度最高支付限额。就业人员（含退休人员）基金支付比例为70%，未就业人员为50%。"],"src":"新华网","url":"http://www.ha.xinhuanet.com/20260723/b90b91d487f74cf2bf2744a1cd8fedaf/c.html","dt":"2026-07-23","rg":"河南"},{"c":"ai","t":"新华视点丨AI发展新趋势：从“能说会道”到“真抓实干”","s":"2026世界人工智能大会在上海举办，展览面积突破10万平方米，1100余家企业参展，超300款产品全球首发，智能体与具身智能成为展会主角。","b":["2026世界人工智能大会暨人工智能全球治理高级别会议7月17日至20日在上海举办，展览总面积首次突破10万平方米，1100余家企业带来数千项展品，超300款产品全球首发。","本届大会清晰勾勒出AI进化趋势，人工智能正从“能说会道”向“真抓实干”迈进。","智能体成为不少展台主角，具身智能领域汇聚200多家企业。","今年参展具身智能企业从去年80多家增长到200多家，共展出208款具身智能终端、超过300台真机。","大会期间，上海人工智能实验室携手高校、科研机构、医院与产业伙伴，发布十项科学智能联合创新成果。"],"src":"新华社","url":"https://www.news.cn/tech/20260720/ac90db107fd242f5896873c706eca285/c.html","dt":"2026-07-20","rg":"上海"},{"c":"ai","t":"从一场大会看AI产业发展新方向","s":"2026世界人工智能大会上，智能体成为主角，AI从问答工具进阶为自主执行的数字伙伴。","b":["7月17日至20日，2026世界人工智能大会暨人工智能全球治理高级别会议在上海举行。展览面积突破10万平方米，展出3000余项展品，策划140余场论坛。","往年，大模型对话能力是各大厂商展示的核心看点。而今年，AI智能体成为全场主角。多家企业推出的智能体产品让AI从“能说”向“会干”跃迁，从工具变成智能伙伴，赋能千行百业和日常生活。"],"src":"新华网","url":"https://www.news.cn/tech/20260719/e6d801e02f1341309006fd6177da8bcb/c.html","dt":"2026-07-19","rg":"地方"},{"c":"ai","t":"《国际人工智能伦理治理行动计划》发布","s":"工业和信息化部会同有关方面共同指导发布《国际人工智能伦理治理行动计划》，围绕全生命周期伦理治理、风险分类分级防控、敏捷治理机制建设等方向提出行动框架。","b":["新华社上海7月17日电（记者周圆、杨有宗）17日，在上海举行的2026世界人工智能大会暨人工智能全球治理高级别会议上，工业和信息化部会同有关方面共同指导发布《国际人工智能伦理治理行动计划》，为全球人工智能治理贡献了兼具原则性与可操作性的行动框架。","行动计划围绕人工智能全生命周期伦理治理、风险分类分级防控、敏捷治理机制建设、产业链协同生态培育、社会氛围营造等方向，呼吁各国结合自身实际积极行动。"],"src":"新华社","url":"https://www.gov.cn/yaowen/liebiao/202607/content_7075890.htm","dt":"2026-07-17","rg":"全国"},{"c":"ai","t":"总投资51亿元的智慧蓝图西部智算中心在庆阳开工","s":"近日，智慧蓝图西部智算中心项目一期工程在甘肃庆阳东数西算产业园区正式开工。","b":["新华网兰州7月16日电（记者郎兵兵）近日，智慧蓝图西部智算中心项目一期工程在甘肃庆阳东数西算产业园区正式开工。该项目一期、二期工程将同步建设，总投资达51亿元，建成后总算力规模可达13.6万P。","智慧蓝图西部智算中心项目一期总投资36亿元，规划用地60亩，建设3栋数据中心、1座动力中心、1座110千伏变电站及高标准算力配套设施，部署高密度机柜共8860架，算力规模可达10.8万P。"],"src":"新华网","url":"http://gs.news.cn/20260716/d0efe2b9e2c44af48d4c6596bf9eb38e/c.html","dt":"2026-07-16","rg":"地方"},{"c":"ai","t":"以人工智能牵引新应用","s":"2025年，我国人工智能核心产业规模超过1.2万亿元，企业数量超过6200家。以人工智能牵引新应用，用新场景打造新业态。","b":["2026世界人工智能大会暨人工智能全球治理高级别会议将于7月17日至20日在上海举行。记者日前在调研中了解到，以人工智能牵引新应用，用新场景打造新业态，人工智能这个“关键变量”，正在成为产业转型升级的“强劲增量”。","2025年，我国人工智能核心产业规模超过1.2万亿元，企业数量超过6200家。在共享出行领域，AI大模型成为共享出行平台的“中枢大脑”，显著解决传统模式下车辆空驶率高、调度低效的痛点。"],"src":"人民日报","url":"http://paper.people.com.cn/rmrbhwb/pc/content/202607/15/content_30168723.html","dt":"2026-07-15","rg":"全国"},{"c":"si","t":"河北省人力资源和社会保障厅 河北省财政厅关于公布2026年社保缴费有关基数的通知","s":"冀人社字〔2026〕57号明确，2026年全省社会保险（含职工基本养老保险、工伤保险、失业保险）缴费基数以2025年全口径城镇单位就业人员月平均工资6794元确定个人缴费基数上下限，下限4076元（60%），上限20382元（300%）。","b":["各市（含定州、辛集市）人力资源社会保障局、财政局，雄安新区公共服务局、财政局：为做好2026年度全省社会保险费征缴工作，现就有关基数通知如下：","2026年全省社会保险（含职工基本养老保险、工伤保险、失业保险）缴费基数以2025年全口径城镇单位就业人员月平均工资6794元确定个人缴费基数上下限，缴费基数下限为4076元（60%），缴费基数上限为20382元（300%）。河北省人力资源和社会保障厅 河北省财政厅 2026年7月14日"],"src":"河北省人力资源和社会保障厅","url":"https://hebfb.hebccw.cn/system/2026/07/18/102204812.shtml","dt":"2026-07-14","rg":"河北"},{"c":"ai","t":"“十五五”开局之年推进算力网建设观察","s":"构建全国一体化算力网是国家现代化的重要标志。","b":["构建全国一体化算力网是国家现代化的重要标志。","习近平总书记强调，“统筹推进算力基础设施建设，深化数据资源开发利用和开放共享”。今年4月召开的中共中央政治局会议部署加强“六张网”规划建设，作为其中重要方面，算力网备受瞩目。"],"src":"新华网","url":"https://www.news.cn/politics/20260714/54ebe0b0ec2142f0828f7123169e2f20/c.html","dt":"2026-07-14","rg":"全国"},{"c":"ai","t":"简报丨2026世界人工智能大会进入倒计时","s":"人民网上海频道发布产业发展简报，介绍大会将于7月17日至20日在上海三大片区举办。","b":["上海，是全国人工智能发展的高地。上海提出深入实施“人工智能+”行动，加强算力设施、行业语料、垂类模型等布局建设，推动新一代智能终端、智能体等广泛运用。","6月17日，2026世界人工智能大会暨人工智能全球治理高级别会议倒计时30天发布会举行。大会以“智能伙伴 共创未来”为主题，将于7月17日至20日在上海世博、张江、西岸三大片区同步举办。"],"src":"人民网","url":"http://sh.people.com.cn/n2/2026/0711/c134768-41636082.html","dt":"2026-07-11","rg":"地方"},{"c":"si","t":"福建省人力资源和社会保障厅 福建省财政厅 国家税务总局福建省税务局关于明确2026年工伤保险缴费基数上下限的通知","s":"闽人社文〔2026〕10号明确自文件印发次月起，全省工伤保险缴费基数上限22893元/月、下限4579元/月。","b":["根据《福建省工伤保险基金省级统收统支实施方案》（闽人社文〔2023〕159号）规定，按照统计部门提供的相关数据，现就调整我省2026年工伤保险缴费基数事项通知如下：","自文件印发次月起，全省工伤保险缴费基数上限按22893元/月、下限按4579元/月执行。福建省人力资源和社会保障厅、福建省财政厅、国家税务总局福建省税务局 2026年7月10日（此件主动公开）。"],"src":"福建省人力资源和社会保障厅","url":"https://rst.fujian.gov.cn/zw/zfxxgk/zfxxgkml/zyywgz/ldgx/202607/t20260716_7178672.htm","dt":"2026-07-10","rg":"其他市"},{"c":"si","t":"国家医保局2026年上半年例行新闻发布会实录","s":"国家医保局发布会上半年数据：截至5月底全国基本医保参保13.19亿人。1—5月基金收入1.61万亿元、支出1.21万亿元。22个省份已出台基本医保省级统筹制度文件，17个省份出台长护险省级实施方案，全国均已实现生育津贴直接发放至个人。","b":["医保制度运行总体平稳。参保规模保持稳定。截至5月底，全国基本医保参保人数13.19亿人，同比增加469万人，其中，职工医保3.86亿人，同比增加716万人；居民医保9.33亿人，同比减少246万人，参保结构持续优化。1-5月，基本医保基金收入1.61万亿元，同比增长8.49%。基本医保基金支出1.21万亿元，同比增长2.12%。","稳妥推进基本医保省级统筹，22个省份已出台制度文件。加快推进长期护理保险制度，河北、山西等17个省份已陆续出台实施方案，参保覆盖约3.2亿人。1-5月，长期护理保险享受待遇137万人。全国均已实现生育津贴按程序直接发放至个人，29个省份实现住院分娩生育医疗费用省内跨统筹区直接结算。1-5月全国跨省异地就医直接结算1.47亿人次，涉及医疗费用1503亿元，减少群众垫付886亿元。"],"src":"国家医疗保障局","url":"https://www.nhsa.gov.cn/art/2026/7/9/art_14_21357.html","dt":"2026-07-09","rg":"全国"},{"c":"ai","t":"超300款AI新品将在2026世界人工智能大会首发","s":"2026世界人工智能大会展览面积突破10万平方米，超300款产品全球首发。","b":["7月7日，记者从上海市政府新闻发布会获悉，2026世界人工智能大会暨人工智能全球治理高级别会议将于7月17日至20日在上海召开，展览总面积首次突破10万平方米，超300款产品将实现全球首发，已推动57个核心场景落地，累计达成162亿元意向合作。","上海市委常委、副市长陈杰介绍，大会策划140余场论坛，联动12个国家部委、8个国家级重点实验室、10余个国际组织，集聚1400余位中外嘉宾。1100余家企业参展，3000余项展品集中亮相。"],"src":"新华网","url":"https://www.news.cn/tech/20260708/fbbd5fbe39b5452098b5dde915b0c959/c.html","dt":"2026-07-08","rg":"地方"},{"c":"si","t":"国家税务总局内蒙古自治区税务局 内蒙古自治区医疗保障局关于开展2026业务年度（2026年7月—2027年6月）职工基本医疗保险费缴费工资申报工作的通告","s":"2026年第2号通告明确，2026业务年度（2026年7月—2027年6月）内蒙古职工基本医疗保险费月缴费基数下限6744元（全口径月平均工资8430元的80%）、上限25290元（300%）。","b":["2026年第2号。按照《中华人民共和国社会保险法》及其配套法规相关要求，结合我区实际，现将2026业务年度（2026年7月—2027年6月）职工基本医疗保险费缴费工资申报工作有关事项通告如下：申报所属期为2026年7月1日至2027年6月30日。","税务机关以2025年自治区全口径城镇单位就业人员月平均工资为基础，确定2026业务年度自治区职工基本医疗保险费月缴费基数。2026业务年度自治区职工基本医疗保险费月缴费基数下限为6744元（8430元的80%）、上限为25290元（8430元的300%）。用人单位申报职工工资在缴费基数上下限范围内的，所申报职工工资即为缴费基数。"],"src":"国家税务总局内蒙古自治区税务局 内蒙古自治区医疗保障局","url":"https://neimenggu.chinatax.gov.cn/xxgk/tzgg/202606/t20260629_895262.html","dt":"2026-06-29","rg":"其他市"},{"c":"ai","t":"主动拥抱人工智能时代的积极尝试——写在权威AI时政资讯智能体“新华语典”上线之际","s":"6月26日，新华社打造的权威AI时政资讯智能体“新华语典”正式上线。","b":["6月26日，新华社打造的权威AI时政资讯智能体“新华语典”正式上线。发布会上，新华社展示了主动拥抱人工智能时代的积极姿态，“新华语典”正式发布，不仅是为大家提供一款智能化工具，更是希望与广大用户一起，共同训练、优化迭代这一智能体。","“新华语典”基于新华社数据、依托先进大模型技术，通过“高可靠内容人工智能”满足广大受众学习、研究、写作等需要，是一款新型垂类智能体。"],"src":"新华每日电讯","url":"https://www.news.cn/20260629/b5019e15d3fe4493ab06e62d88174d04/c.html","dt":"2026-06-29","rg":"全国"},{"c":"si","t":"佛山市人力资源和社会保障局 国家税务总局佛山市税务局关于调整2026社保年度我市失业保险缴费基数上限的通知","s":"佛人社〔2026〕5号明确，2026社保年度佛山市失业保险缴费基数上限调整为31395元（按2025年城镇非私营单位在岗职工月平均工资10465元的300%），下限维持2080元不变，自2026年7月1日起执行。","b":["佛人社〔2026〕5号。根据《广东省失业保险条例》和《佛山市统计局关于公布2025年佛山市城镇单位就业人员平均工资数据的通知》，现就我市失业保险缴费基数上限调整工作通知如下：","失业保险缴费基数上限调整为31395元，即按2025年我市城镇非私营单位在岗职工月平均工资10465元的300%调整；下限维持2080元不变。本通知自2026年7月1日起执行。佛山市人力资源和社会保障局 国家税务总局佛山市税务局 2026年6月26日"],"src":"佛山市人力资源和社会保障局 国家税务总局佛山市税务局","url":"https://guangdong.chinatax.gov.cn/gdsw/fssw_tzgg/2026-06/30/content_331129afa08f43e3811eb81ee5b35e67.shtml","dt":"2026-06-26","rg":"其他市"},{"c":"si","t":"人力资源社会保障部 教育部 财政部 国家税务总局关于失业保险支持企业稳岗扩岗的通知","s":"人社部等四部门印发人社部发〔2026〕39号，延续稳岗返还、一次性扩岗补助和技能提升补贴。大型企业返还不超过上年度失业保险费30%，中小微不超过60%；招用符合条件高校毕业生和失业青年每人补助不超过1500元。","b":["人社部发〔2026〕39号。一、延续实施稳岗返还政策。参保企业足额缴纳失业保险费12个月以上，上年度未裁员或裁员率不高于上年度全国城镇调查失业率控制目标，30人（含）以下的参保企业裁员率不高于参保职工总数20%的，可以按规定享受失业保险稳岗返还。大型企业按不超过企业及其职工上年度实际缴纳失业保险费的30%返还，中小微企业按不超过60%返还。社会组织、律师事务所、会计师事务所以及以单位形式参保的个体工商户参照实施。","二、延续实施一次性扩岗补助政策。对招用毕业年度及离校两年内未就业高校毕业生、16—24岁登记失业青年，签订劳动合同并为其足额缴纳3个月以上失业、工伤、职工养老保险费的企业和社会组织，可按每招用1人不超过1500元的标准发放一次性扩岗补助。三、优化技能提升补贴政策。参加失业保险12个月以上的企业在职职工或领取失业保险金人员，取得相应职业等级证书的，可按初级、中级、高级分别领取不超过1000元、1500元、2000元的技能提升补贴。"],"src":"中华人民共和国人力资源和社会保障部","url":"https://www.mohrss.gov.cn/xxgk2020/fdzdgknr/zcfg/gfxwj/shbx/202607/t20260702_579405.html","dt":"2026-06-18","rg":"全国"},{"c":"ai","t":"我国出台17项举措加快发展“人工智能+消费”","s":"商务部等8部门发布关于加快“人工智能+消费”发展的实施意见，以扩大智能商品消费、赋能服务消费、创新消费场景为重点，提出5方面17条举措。","b":["新华社北京6月18日电（记者谢希瑶）商务部等8部门关于加快“人工智能+消费”发展的实施意见18日对外发布。实施意见以推动人工智能与消费深度融合为主线，提出5方面17条举措。","在商品消费领域，实施意见提出增加人工智能产品新供给，培育智能穿戴消费市场，促进人工智能机器人消费，面向“一老一小”等重点人群加快养老机器人、陪伴机器人等应用示范。"],"src":"新华社","url":"https://www.news.cn/fortune/20260618/64e8a60e8a344d05a3945be70fb60477/c.html","dt":"2026-06-18","rg":"全国"},{"c":"ai","t":"银行业保险业人工智能安全开发应用指导意见出台","s":"国家金融监督管理总局发布《关于银行业保险业人工智能安全开发应用的指导意见》，从治理架构、开发应用、数据治理、算力建设、风险管理等方面提出32项指导性意见。","b":["新华社北京6月18日电（记者李延霞、张千千）国家金融监督管理总局6月18日对外发布《关于银行业保险业人工智能安全开发应用的指导意见》，要求开发应用人工智能的银行业保险业金融机构要统筹发展和安全，推动人工智能应用合规、透明、可信赖。","指导意见从治理架构、开发应用、数据治理、算力建设、风险管理、能力提升、保障与监督等方面提出了32项指导性意见。"],"src":"新华社","url":"https://www.news.cn/20260618/048469df8b834b36a4e9fe5e4249bacb/c.html","dt":"2026-06-18","rg":"全国"},{"c":"ai","t":"工业和信息化部印发意见 推动“人工智能+信息通信”创新发展","s":"工业和信息化部印发《“人工智能+信息通信”创新发展实施意见（2026—2028年）》，提出到2028年形成30个以上高价值典型场景、打造一批典型应用和特色智能体，城域算力1毫秒时延圈覆盖率不低于75%。","b":["工业和信息化部印发《“人工智能+信息通信”创新发展实施意见（2026—2028年）》，提出到2028年，信息通信智能运营和服务能力达到国际先进水平，信息通信网络初步实现高等级自智，形成30个以上高价值典型场景，打造一批典型应用和特色智能体。","网络、算力等信息基础设施支撑人工智能能力进一步提升，城域算力1毫秒时延圈覆盖率不低于75%。"],"src":"人民日报","url":"https://www.gov.cn/lianbo/202606/content_7071789.htm","dt":"2026-06-11","rg":"全国"},{"c":"ai","t":"2026年度人形机器人与具身智能实景实训专项行动启动","s":"工业和信息化部、国务院国资委联合印发通知，启动2026年度人形机器人与具身智能实景实训专项行动，提出到2026年底在一批代表性场景完成应用验证和常态部署，凝练百个以上高价值应用场景。","b":["记者9日从工业和信息化部获悉，工业和信息化部、国务院国资委联合印发通知，正式启动2026年度人形机器人与具身智能实景实训专项行动，推动人形机器人与具身智能在真实生产生活环境中常态化部署、工程化验证、规模化落地。","行动提出，到2026年底，人形机器人等重点产品在一批代表性场景中率先完成应用验证和常态部署，开启“作业模式”；凝练形成百个以上高价值应用场景，带动形成万台级规模落地能力。"],"src":"科技日报","url":"https://www.news.cn/tech/20260610/0ac12d4162c34166ab66c973aab1f776/c.html","dt":"2026-06-10","rg":"全国"},{"c":"ai","t":"为AI发展提供充足“燃料”　行业高质量数据集建设方案落地","s":"国家数据局日前印发《关于推进行业高质量数据集建设行动的实施方案》。","b":["记者6月8日从国家数据局获悉，国家数据局日前印发《关于推进行业高质量数据集建设行动的实施方案》，提出到2028年底，建成一批覆盖重点领域、经过应用验证的行业高质量数据集，打造一批数据驱动人工智能创新发展的典型应用场景。","专家表示，当前人工智能正在加速从“可用”向“好用”迈进，高质量数据集作为大模型训练与应用的基石，供给规模与质量直接决定人工智能创新高度与产业落地深度。"],"src":"经济参考报","url":"http://jjckb.xinhuanet.com/20260609/18151f5f77cb4b98a2116d08f3bc56b8/c.html","dt":"2026-06-09","rg":"全国"},{"c":"ai","t":"《2026人工智能产业发展趋势研究报告》在无锡发布","s":"报告称我国已跻身全球人工智能发展第一方阵，截至2025年底建成万卡级智算集群42个。","b":["作为新一轮科技革命的核心引擎，人工智能正加速渗透人类生产生活肌理。《报告》认为，当前人工智能竞争已由单纯的技术和市场竞赛，演变为围绕技术壁垒、供应链安全和数字时代发展权的系统性博弈。","从基础支撑来看，伴随大模型训练、多模态应用以及智能体爆发，AI算力迎来爆发式增长。截至2025年底，我国建成万卡级智算集群42个，智算规模稳居全球前列。"],"src":"新华网","url":"https://js.news.cn/20260606/45b0ccfe30884048ae29acc86e12b52a/c.html","dt":"2026-06-06","rg":"地方"},{"c":"ai","t":"两部门布局人工智能计量能力建设","s":"市场监管总局、国家发展改革委联合印发《人工智能计量体系和能力建设指引（2026版）》，围绕基础支撑、通用技术、核心技术、计量技术规范、计量服务产业、智能赋能计量等六大部分系统布局人工智能计量能力建设。","b":["近日，市场监管总局、国家发展改革委联合印发《人工智能计量体系和能力建设指引（2026版）》，系统布局人工智能计量能力建设。","指引围绕基础支撑、通用技术、核心技术、计量技术规范、计量服务产业、智能赋能计量等六大部分系统布局，打通实验室创新与行业应用“最后一公里”。"],"src":"新华社","url":"https://www.news.cn/20260528/7ee10de141a8405298a5bdcfd4a85055/c.html","dt":"2026-05-28","rg":"全国"},{"c":"si","t":"6月30日截止 海南2026年度城乡居民医保+长护险“双保障”逾期全额自费","s":"海南2026年度城乡居民医保个人缴费400元、叠加长护险后合计426元，6月30日后将失去700元财政补助。","b":["2026年度海南省城乡居民医保参保缴费6月30日截止。今年海南省医保同步叠加长期护理保险。","2026年海南城乡居民医保和长护险缴费标准为426元/年（含长护险居民个人缴费26元），其中城乡居民基本医疗保险个人缴费400元，财政补助标准为700元。"],"src":"新华网","url":"http://hq.news.cn/20260522/a5786f987d12487b8a138ad86822bef9/c.html","dt":"2026-05-22","rg":"海南"},{"c":"ai","t":"国家网信办、国家发展改革委、工业和信息化部联合印发《智能体规范应用与创新发展实施意见》","s":"近日，国家网信办、国家发展改革委、工业和信息化部联合印发《智能体规范应用与创新发展实施意见》。","b":["近日，国家网信办、国家发展改革委、工业和信息化部联合印发《智能体规范应用与创新发展实施意见》。《实施意见》旨在落实国务院《关于深入实施“人工智能+”行动的意见》，促进智能体规范应用与创新发展。","《实施意见》提出，智能体是具备自主感知、记忆、决策、交互与执行能力的智能系统，是人工智能产品及服务的重要形态。"],"src":"中国网信网","url":"https://www.cac.gov.cn/2026-05/08/c_1779979789472520.htm","dt":"2026-05-08","rg":"全国"},{"c":"si","t":"新华视点丨社保“第六险”来了 读懂这些关键“热词”","s":"中办、国办印发意见，要求用3年左右基本建立长期护理保险制度，从试点转向全国推行。","b":["当前，中国60岁及以上老年人口达3.2亿，其中失能老人约3500万。","中办、国办日前发布《关于加快建立长期护理保险制度的意见》，要求用3年左右时间基本建立适应我国基本国情的长期护理保险制度。","长期护理保险费率统一控制在0.3%左右，不设起付线。"],"src":"新华社","url":"https://www.xinhuanet.com/politics/20260326/73142ee6182b41d0a52b75b9624f2539/c.html","dt":"2026-03-26","rg":"全国"},{"c":"si","t":"【重要通知】2026年度城乡居民基本医疗保险集中缴费期进入倒计时","s":"青海2026年度城乡居民医保集中缴费期至2026年2月28日结束，个人缴费标准400元。","b":["2026年青海省城乡居民基本医疗保险集中缴费期将于2月28日正式结束。集中参保缴费期为2025年10月21日至2026年2月28日。","2026年7月1日后缴费的，财政补助（700元）和个人缴费（400元）全部由个人负担，并自缴费之日起3个月后享受医保待遇。"],"src":"青海省医保局","url":"https://ybj.qinghai.gov.cn/20260225/dd8880e44a4745e88075365bcb1ed7ea/c.html","dt":"2026-02-25","rg":"青海"},{"c":"ai","t":"中国人工智能双线进阶","s":"中国人工智能沿技术向上突破、应用向下扎根双线演进，通专融合与场景落地同步推进。","b":["当前，人工智能正沿着“技术向上突破、应用向下扎根”的双线路径加速演进。从实验室里的算法迭代到产业一线的场景落地，从算力底座的夯实到全球生态的共建，中国人工智能正以通专融合的技术探索、场景深耕的应用实践，勾勒出高质量发展的新图景。","1月22日，在新加坡召开的第四十届人工智能协会年会（AAAI 2026）上，通用人工智能的突破成为全球AI领域的焦点。上海人工智能实验室主任、首席科学家周伯文在大会特邀报告中提出，当前人类已身处“通用人工智能”（AGI）前夕。"],"src":"新华网","url":"https://www.news.cn/tech/20260202/517d7ecbfc834ef684717df7f0318c0e/c.html","dt":"2026-02-02","rg":"全国"},{"c":"ai","t":"新华深读｜2026年中国AI发展趋势前瞻","s":"2026年是“十五五”开局之年，中国将加强人工智能同产业、文化、民生、治理相结合。","b":["人工智能企业数量超过6000家，AI核心产业规模预计突破1.2万亿元，同比增长近30%；国产开源大模型全球累计下载量突破100亿次；中国成为AI专利最大拥有国，在全球占比达60%。这些数据勾勒出2025年中国AI发展的图景。","2026年是“十五五”开局之年。根据“十五五”规划建议，中国将加强人工智能同产业发展、文化建设、民生保障、社会治理相结合，全方位赋能千行百业。"],"src":"新华网","url":"https://www.news.cn/20260128/3b2f11906fd74ca397fef9996c805a60/c.html","dt":"2026-01-28","rg":"全国"},{"c":"ai","t":"特稿丨展望全球人工智能2026年演进新局","s":"新华社展望2026年全球人工智能，指出大模型竞赛将带动智能体应用，能源压力与治理规则落地同步加快。","b":["站在2026年起点，技术、产业、能源、治理多重变量交织，将共同塑造这一关键年份。","2026年，人工智能大模型你追我赶的竞争趋势将延续，OpenAI、谷歌、深度求索等将发布规模更大或效率更高的最新版本大模型。","高德纳预测，2026年40%的企业应用将嵌入任务型AI智能体，2025年这一比例还不足5%。","国际能源署报告称，到2030年全球数据中心电力需求预计增长一倍以上，达约945太瓦时。","欧盟《人工智能法案》大部分规则将于2026年8月开始生效。"],"src":"新华社","url":"http://www.xinhuanet.com/20260120/13a2ce94ab9e4b349ffa56d9c2112d3b/c.html","dt":"2026-01-20","rg":"全国"},{"c":"si","t":"国家税务总局安徽省税务局关于开展2026年度用人单位社会保险费缴费工资申报工作的通告","s":"安徽明确2026年缴费工资按2025年月均工资申报，个人缴费基数上下限暂按4311元至21556元执行，待新标准发布后调基补差。","b":["根据《中华人民共和国社会保险法》和《安徽省社会保险费征缴暂行规定》等政策规定，现就2026年度我省用人单位社会保险费缴费工资申报工作相关事项通告如下。申报单位范围包括在我省参加企业职工基本养老、机关事业单位基本养老、职工基本医疗（含生育）、工伤和失业保险等险种的各类用人单位。申报期限截至2026年6月30日。","在职职工以2025年月平均工资申报缴费工资，2026年新入职职工以起薪当月工资收入申报。个人缴费基数上下限暂按2025年度标准执行，即下限4311元/月，上限21556元/月。待省有关部门发布2026年度标准后，再按新标准征收并调整补差。"],"src":"安徽省税务局","url":"https://anhui.chinatax.gov.cn/art/2026/1/19/art_9538_1290013.html","dt":"2026-01-19","rg":"安徽"},{"c":"si","t":"新华鲜报丨再扩围！医保个人账户跨省共济提速","s":"国家医保局会同财政部发布通知，加快实现职工基本医保个人账户跨省共济使用，支持近亲属就医购药、参保缴费。","b":["国家医保局会同财政部1月9日发布通知，加快实现职工基本医保个人账户跨省共济使用。","跨省共济即参保人个人账户的钱能跨省让家人使用。","适用对象为职工基本医疗保险参保人的近亲属，包括配偶、父母、子女、兄弟姐妹、祖父母、外祖父母、孙子女、外孙子女。","被共济人应是基本医保参保对象，职工医保或城乡居民医保均可。","共济资金可用于定点医疗机构个人负担医疗费用、定点药店购药费用，也可用于参加城乡居民基本医保、长期护理险的个人缴费。"],"src":"新华社","url":"https://www.news.cn/fortune/20260109/d1c76db1dead4925964dfe8ae8c74c5a/c.html","dt":"2026-01-09","rg":"全国"},{"c":"si","t":"国家税务总局江苏省税务局 江苏省人力资源和社会保障厅 江苏省医疗保障局关于开展2026年用人单位社会保险缴费工资申报工作的通知","s":"江苏明确2026年用人单位社保缴费工资申报期为1月11日至5月25日，基数上下限暂按2025年标准执行。","b":["根据社会保险法等规定，在江苏参加基本养老保险、基本医疗保险、工伤保险、失业保险和生育保险的用人单位，应为2025年12月在职职工及2026年新入职职工申报缴费工资，申报时间为2026年1月11日至2026年5月25日。","缴费工资基数上下限暂按2025年度标准执行，上限暂按24762元、下限暂按4952元。待2025年度全口径城镇单位就业人员平均工资确定后，省有关部门将发布2026年度社保缴费工资基数上下限标准并按规定征收。"],"src":"江苏省税务局","url":"https://jiangsu.chinatax.gov.cn/art/2026/1/9/art_8274_1695385.html","dt":"2026-01-09","rg":"江苏"},{"c":"si","t":"国家税务总局山西省税务局关于开展2026年度社会保险费缴费工资申报工作的通告","s":"山西省用人单位2026年度社会保险费缴费工资申报时间为2026年1月1日至5月31日。","b":["为做好全省2026年度用人单位社会保险费缴费工资申报工作，现就相关事项通告如下。","缴费工资以职工本人2025年度的月平均工资作为申报2026年度社会保险费缴费工资的依据。2026年新入职人员，以起薪当月工资作为申报2026年度的缴费工资。"],"src":"山西省税务局","url":"https://shanxi.chinatax.gov.cn/son/detail/yc-11427-522-1816933","dt":"2026-01-09","rg":"山西"},{"c":"ai","t":"智源发布2026十大AI技术趋势","s":"智源研究院报告指出，人工智能正从语言学习转向对物理世界底层秩序的理解与建模。","b":["当AI大模型开始尝试理解并预测物理世界的运动规律，一场深刻的范式变革正在发生。","1月8日，北京智源人工智能研究院发布年度报告《2026十大AI技术趋势》。报告指出，人工智能的演进核心正发生关键转移：从追求参数规模的语言学习，迈向对物理世界底层秩序的深刻理解与建模，行业技术范式迎来重塑。"],"src":"新华网","url":"http://www.xinhuanet.com/tech/20260108/b99127c88a4640bbab49e5c6294264d2/c.html","dt":"2026-01-08","rg":"全国"},{"c":"ai","t":"2026人形机器人产业展望：10万级量产将至 商业化元年开启","s":"业内预计2026年国内人形机器人产量有望达10万台级，产业由量产元年迈向规模放量。","b":["新华社北京1月7日电 《中国证券报》7日刊发文章《2026人形机器人产业展望：10万级量产将至 商业化元年开启》。文章称，2025年12月31日，智元机器人推出全球首款便携人形机器人启元Q1；2026年1月4日，宇树科技发布新一代仿生人形机器人Unitree H2的训练视频。","两家头部人形机器人企业的接连动作勾勒出2026年产业发展的三大核心趋势：成本下探推动规模放量、场景拓展加速商业化落地、技术突破破解行业瓶颈。业内人士直言，若2025年人形机器人产业完成从“1-10”的关键突破，2026年便将正式开启向“10-100”的规模性跨越。"],"src":"新华网","url":"http://www.xinhuanet.com/tech/20260108/46b1220e159d4f80bc6a4240eb3b47b5/c.html","dt":"2026-01-08","rg":"全国"},{"c":"si","t":"关于增加城乡居民基本养老保险最高缴费档次的通知","s":"安徽自2026年1月1日起增加9000元城乡居民基本养老保险缴费档次，全省统一为16档。","b":["安徽明确自2026年1月1日起，在现有15个缴费档次基础上增加9000元缴费档次。调整后全省缴费档次统一为200元至9000元共16个档次。","缴费补贴及资金安排仍按皖人社发〔2019〕15号文件规定执行，缴费2000元及以上的补贴200元。"],"src":"安徽省人社厅","url":"https://hrss.ah.gov.cn/public/6595721/80782107.html","dt":"2025-12-31","rg":"安徽"},{"c":"si","t":"关于开展2026年度社会保险费缴费工资申报工作的通告","s":"广西明确2026年度社会保险费缴费工资申报时间为1月1日至3月31日，按2025年月平均工资据实申报。","b":["在广西各级社保经办机构参加职工基本养老保险、工伤保险、失业保险、职工基本医疗保险及其他补充险种等社会保险费和职业年金的单位及职工，应于2026年1月1日至2026年3月31日申报缴费工资。","用人单位应以本单位职工上一年度（2025年）月平均工资据实申报2026年度缴费工资，2026年新入职人员以起薪当月工资作为2026年度缴费工资。"],"src":"广西税务局","url":"https://guangxi.chinatax.gov.cn/xxgk/tzgg/202512/t20251231_427438.html","dt":"2025-12-31","rg":"广西"},{"c":"si","t":"国家税务总局贵州省税务局关于开展2026年度社会保险费缴费工资申报工作的通告","s":"贵州省用人单位2026年度社会保险费缴费工资申报时间为2026年1月1日至3月31日。","b":["为做好全省用人单位2026年度社会保险费缴费工资申报工作，现就相关事项通告如下。","用人单位以2025年度在职职工月平均工资作为职工2026年度社会保险费缴费工资。2026年新参保职工以其起薪当月的应发工资作为2026年度缴费工资。"],"src":"贵州省税务局","url":"https://guizhou.chinatax.gov.cn/zfxxgk1/fdzdgknr_5635312/gzdt/tzgg_5635320/202512/t20251231_89108243.html","dt":"2025-12-31","rg":"贵州"},{"c":"si","t":"国家税务总局厦门市税务局 厦门市人力资源和社会保障局 厦门市医疗保障局关于开展2026年社会保险费年度缴费工资申报工作的通知","s":"厦门三部门通知2026年社保费年度缴费工资申报时间为2026年1月1日至3月31日，用人单位应如实申报上年度月平均工资作为缴费基数依据。","b":["依据《中华人民共和国社会保险法》以及福建省、厦门市关于社会保险费（含医保）缴费的有关规定，2026年社会保险费年度缴费工资申报时间为2026年1月1日至2026年3月31日。","用人单位应如实向税务机关申报参保职工的上年度月平均工资，作为确定2026年度社会保险费缴费基数的依据。2026年新入职人员以起薪当月工资作为2026年度的缴费工资。用人单位在申报年度缴费工资时，应签订诚信承诺书，并将申报的缴费工资告知职工，由职工本人签字确认。"],"src":"国家税务总局厦门市税务局","url":"http://xiamen.chinatax.gov.cn/xmswcms/content/S67703.html","dt":"2025-12-30","rg":"其他市"},{"c":"si","t":"国家税务总局甘肃省税务局 甘肃省人力资源和社会保障厅 甘肃省医疗保障局关于2026年度全省用人单位社会保险费缴费工资申报的通告","s":"甘肃三部门通告2026年用人单位社保缴费工资申报规则，并预设2026年养老、工伤、失业月缴费基数下限4610元、上限22014元，职工医保下限4403元、上限22014元。","b":["职工年度缴费工资为职工本人上年度月平均工资（年度工资总额/工作月份），当年新增职工缴费工资为起薪当月工资。用人单位申报的企业职工基本养老保险费、职工基本医疗保险费、工伤保险费、失业保险费的缴费工资应保持一致。","2026年按用人单位参加职工养老、工伤、失业保险的月缴费基数预设下限为4610元/月，预设上限为22014元/月，待2026年缴费基数上下限标准发布后产生补差或退费。按用人单位参加职工医保的月缴费基数下限为4403元/月，上限为22014元/月。灵活就业人员养老预设下限4610元、上限22014元；职工医保缴费基数在7338元/月的60%-300%之间，具体按各统筹区确定。"],"src":"国家税务总局甘肃省税务局","url":"http://gansu.chinatax.gov.cn/art/2025/12/30/art_8549_4533.html","dt":"2025-12-30","rg":"其他市"},{"c":"si","t":"温馨提示","s":"深圳市医疗保障局公布：2026年1月1日至12月31日，职工基本医疗保险和生育保险缴费基数下限6727元、上限33633元；居民基本医疗保险缴费基数按6760元/月计算。自2026年1月1日起，企业职工医保一档单位费率由5%恢复为6%，灵活就业人员费率由7%恢复为8%。","b":["根据《深圳市医疗保障办法》（深圳市人民政府令第358号）和相关统计数据，自2026年1月1日起至2026年12月31日止，我市职工基本医疗保险和生育保险的缴费基数下限为6727元，上限为33633元；居民基本医疗保险的缴费基数按6760元/月的标准计算。我市基本医疗保险待遇偿付基数涉及本市上上年度在岗职工年平均工资的，按177057元/年的标准计算。","根据粤办函〔2023〕302号和深府办规〔2023〕5号，我市降低医疗保险成本相关政策实施期限至2025年12月31日。自2026年1月1日起，企业职工基本医疗保险一档单位缴费费率由5%恢复为6%，灵活就业人员缴费费率由7%恢复为8%，其余单位和个人的缴费费率继续按照《深圳市医疗保障办法》规定执行。"],"src":"深圳市医疗保障局","url":"https://hsa.sz.gov.cn/szsylbzjwzgkml/szsylbzjwzgkml/qt/tzgg/content/post_12574511.html","dt":"2025-12-29","rg":"深圳"},{"c":"si","t":"国家税务总局黑龙江省税务局关于做好2026年社会保险费缴费工资申报工作的通告","s":"黑龙江部署2026年用人单位社会保险费缴费工资申报，机关事业单位集中申报至1月13日，其他单位至1月20日。","b":["在黑龙江省参加社会保险的用人单位应申报本单位参保职工个人2025年度月平均工资，2026年新入职人员申报起薪当月工资。年度缴费工资生效时间为2026年1月至12月。","机关事业单位集中申报时间为2026年1月1日至2026年1月13日，其他用人单位集中申报时间为2026年1月1日至2026年1月20日。"],"src":"黑龙江省税务局","url":"http://heilongjiang.chinatax.gov.cn/art/2025/12/29/art_8308_574340.html","dt":"2025-12-29","rg":"黑龙江"},{"c":"si","t":"国家税务总局新疆维吾尔自治区税务局关于开展2026年度社会保险费缴费工资（基数）申报工作的通告","s":"新疆2026年度社保缴费工资申报时间为2026年1月1日至3月31日，用人单位按2025年月均工资申报。","b":["申报时间为2026年1月1日至2026年3月31日。申报范围包括参加企业职工基本养老、机关事业单位基本养老、职工基本医疗（含生育）、工伤和失业保险等险种的各类用人单位。","用人单位已参保职工以2025年度月平均工资作为2026年度缴费基数依据，2026年新入职职工按起薪当月月工资标准确定。"],"src":"新疆税务局","url":"https://xinjiang.chinatax.gov.cn/zwgk/tzgg/202512/t20251225_153982.htm","dt":"2025-12-25","rg":"新疆"},{"c":"si","t":"2026年以个人身份参加职工医保缴费标准公布 一档3105元/年·人 二档6831元/年·人","s":"重庆市官方发布：2026年以个人身份参加职工医保按年缴费基数62100元（5175元/月），一档3105元/年·人、二档6831元/年·人；一次性趸缴基数73272元。长期护理保险缴费标准147元/年·人。","b":["重庆市医疗保障局、重庆市财政局、国家税务总局重庆市税务局日前印发《关于2026年以个人身份参加城镇职工医疗保险、长期护理保险缴费有关问题的通知》。2026年，以个人身份参加职工医保按年度缴费的缴费基数及缴费期内个人账户资金划入基数为62100元（5175元/月）。一档缴费标准为3105元/年·人，二档缴费标准为6831元/年·人。","2026年一次性趸缴的缴费基数为73272元。缴费期满个人身份参加职工医保退休人员大额医保缴费标准为60元/年·人。2026年长期护理保险缴费标准为147元/年·人：个人身份参保人员全额缴纳147元，正常享受职工医保退休待遇人员个人缴纳73.5元、医保基金划拨73.5元。"],"src":"重庆市人民政府门户网站","url":"https://www.cq.gov.cn/ywdt/jrcq/202512/t20251219_15256163_app.html","dt":"2025-12-19","rg":"其他市"},{"c":"si","t":"西藏自治区关于调整机关事业单位及企业离退休人员养老待遇发放模式的公告","s":"西藏自2026年2月起将养老待遇由总额发放改为基本养老金与补贴分项精细化发放。","b":["从2026年2月起，西藏养老待遇发放模式将由原来总待遇模式调整为精细化待遇发放：基本养老金按月发放；交通费、取暖费等其他补贴按月发放；体检费、护工费于每年3月一次性发放。","未完成资格认证的将影响待遇发放。可通过“西藏数字人社”APP或微信小程序查询本人具体待遇情况。"],"src":"西藏人社厅","url":"http://hrss.xizang.gov.cn/xwzx/tzgg/202512/t20251219_515079.html","dt":"2025-12-19","rg":"西藏"},{"c":"si","t":"广州市医疗保障局 广州市财政局关于明确2026年度广州市城乡居民医保筹资标准调整方案的通知","s":"穗医保发〔2025〕34号明确，2026年度广州市城乡居民医保在校学生个人缴费413元、财政补助956元；其他参保人员个人缴费549元、财政补助820元。缴费基数计算规则按穗府办规〔2021〕14号执行，自印发之日起实施。","b":["穗医保发〔2025〕34号。为进一步健全完善我市基本医疗保障体系，促进我市城乡居民基本医疗保险事业更高质量发展，积极做好2026年度城乡居民医保扩面征缴工作，根据穗府办规〔2021〕14号有关规定，经市人民政府同意，现将我市2026年度城乡居民医保筹资标准调整方案明确如下：","一、调整方案内容。2026年度城乡居民医保筹资标准调整如下：在校学生个人缴费标准为每人413元，财政补助标准为每人956元；其他参保人员个人缴费标准为每人549元，财政补助标准为每人820元。2026年度城乡居民医保缴费基数计算规则按照14号文相应规定执行。本调整方案自印发之日起实施。国家、省另有新规定的，按国家、省规定执行。广州市医疗保障局 广州市财政局 2025年12月12日"],"src":"广州市医疗保障局","url":"https://www.gz.gov.cn/xw/tzgg/content/post_10596116.html","dt":"2025-12-16","rg":"广州"},{"c":"si","t":"《关于明确2026年度广州市城乡居民医保筹资标准调整方案的通知》政策解读","s":"官方解读称，在符合国家规定的2026年城乡居民医保最低筹资标准前提下，广州市2026年城乡居民医保筹资标准不调增，继续按上年度标准执行：在校学生个人413元、财政956元；其他人员个人549元、财政820元。","b":["为适应人均预期寿命不断增长、医疗消费水平持续提升的形势，国家每年发布最低缴费标准要求各地逐年提高城乡居民医保个人缴费标准。但随着外部经济环境变化，我市群众期盼适当放缓增长速度。综合我市基金和经济运行实际，在符合国家规定的2026年城乡居民医保最低筹资标准（个人不低于400元，财政不低于700元）的前提下，2026年广州市城乡居民医保筹资标准不调增，继续按照上年度标准执行。","2026年度城乡居民医保筹资标准为在校学生个人缴费每人413元、财政补助每人956元；其他参保人员个人缴费每人549元、财政补助每人820元。《通知》自印发之日起实施。国家、省另有新规定的，按国家、省规定执行。"],"src":"广州市医疗保障局","url":"https://www.gz.gov.cn/gzzcwjk/gzdata/content/post_10596091.html","dt":"2025-12-12","rg":"广州"},{"c":"si","t":"浙江省2025年社会保险费缴费基数上下限标准是多少？","s":"国家税务总局浙江省税务局热点问答依据浙人社发〔2025〕52号答复：2025年缴费基数上限25299元/月，下限4986元/月。","b":["问：浙江省2025年社会保险费缴费基数上下限标准是多少？","答：根据浙人社发〔2025〕52号规定：从2025年1月1日起，我省社会保险个人缴费基数上限根据2024年度非私营和私营单位就业人员加权平均工资调整；缴费基数下限根据2023年度加权平均工资调整。据此，我省2025年缴费基数上限按2024年加权平均工资的300%确定，为25299元/月；缴费基数下限按2023年加权平均工资8310元/月的60%确定，为4986元/月。"],"src":"国家税务总局浙江省税务局","url":"https://zhejiang.chinatax.gov.cn/art/2025/12/11/art_13314_645797.html","dt":"2025-12-11","rg":"浙江"},{"c":"si","t":"贵州省人力资源和社会保障厅 贵州省财政厅 国家税务总局贵州省税务局关于调整全省城乡居民基本养老保险个人缴费档次的通知","s":"贵州自2026年1月1日起调整城乡居民养老保险缴费档次，并按档次给予10%或定额300元补贴。","b":["从2026年1月1日起，增加4000元、5000元、6000元3个缴费档次。调整后为每人每年300元至6000元共9档。","对选择300元至2000元档次的按缴费金额的10%给予补贴；对选择3000元至6000元档次的按300元给予补贴。"],"src":"贵州省人社厅","url":"https://rst.guizhou.gov.cn/zwgk/jdhy/zcwj/202512/t20251210_89033607.html","dt":"2025-12-10","rg":"贵州"},{"c":"si","t":"四川省医疗保障事务中心关于做好2026年度省本级职工医疗保险征缴工作的通知","s":"明确2026年度省本级职工基本医疗（生育）保险单位费率11.4%，个体参保人员按月缴费基数7646元相应比例缴纳，单位职工最低月缴费基数4587.6元。","b":["2026年度省本级职工基本医疗（生育）保险参保单位征缴费率为11.4%（单位9.4%，个人2%由单位代扣代缴）。根据川人社办发〔2025〕39号，选择统账结合或单建统筹的省本级个体参保人员，分别以月缴费基数标准7646元(年缴费基数标准91752元）的11%、7.5%缴纳。2026年度省本级参保单位职工基本医疗（生育）保险最低月缴费基数标准为4587.6元（7646×60%=4587.6元）。","2026年度省本级享受公务员医疗补助的参保单位，按1840元/人·年的标准为单位在职职工和退休人员统一申报缴费。非公务员医疗补助的省本级参保单位，2026年度补充医疗保险一档730元/人·年，二档1840元/人·年。"],"src":"四川省医疗保障局","url":"http://ylbzj.sc.gov.cn/scsybj/nc010416/2025/12/3/ded1b37605e7411e9721c8609ad3a0cc.shtml","dt":"2025-12-03","rg":"其他市"},{"c":"si","t":"关于2025年社会保险缴费基数上下限调整的通告","s":"中山市人社局、税务局通告：自2025年7月1日起，企业职工基本养老保险缴费基数下限调整为4775元、上限27549元；机关事业单位养老保险自2025年1月1日起下限5510元、上限27549元；特定人员单项工伤保险2025年11月1日至2026年6月30日下限5510元、上限27549元。","b":["根据粤人社发〔2025〕32号及粤人社规〔2024〕6号有关规定，现对我市社会保险有关险种的缴费基数上下限予以调整。","一、自2025年7月1日起，企业职工基本养老保险缴费基数下限由4767元调整为4775元，缴费基数上限由27501元调整为27549元。二、自2025年1月1日起，机关事业单位养老保险缴费基数下限由5500元调整为5510元，上限由27501元调整为27549元。三、2025年11月1日至2026年6月30日，特定人员单项工伤保险缴费基数下限由5500调整为5510元，缴费基数上限由27501元调整为27549元。中山市人力资源和社会保障局、国家税务总局中山市税务局 2025年12月2日"],"src":"中山市人力资源和社会保障局","url":"https://hrss.zs.gov.cn/tzgg/gggs/content/post_2570361.html","dt":"2025-12-02","rg":"其他市"},{"c":"si","t":"广州失业保险金标准 = 本市月最低工资的 90%（2070 元/月）","s":"按月领取的失业保险金标准为本市月最低工资标准的 90%，现为 2070 元/月。领取须满足累计缴费、非本人意愿中断就业、已办失业登记等条件。","b":["按月领取的失业保险金标准为本市月最低工资标准的 90%，现为 2070 元/月。","领取的基本条件：① 失业前单位和本人累计缴费满 1 年（或不满 1 年但本人有尚未领完的期限）；② 非因本人意愿中断就业；③ 已办失业登记并有求职要求。","2070 元取自 2025 年 11 月版官方问答，会随最低工资调整，以社保局核定单为准。","发布机关：广州市人力资源和社会保障局。适用范围：广州市。"],"src":"广州市人力资源和社会保障局","url":"https://rsj.gz.gov.cn/ywzt/shbz/gzdt/content/post_10577823.html","dt":"2025-11-01","rg":"广州市"},{"c":"si","t":"自治区医疗保障局 国家税务总局宁夏回族自治区税务局关于做好2026年度城乡居民基本医疗保险参保征缴工作的通知","s":"宁夏2026年度城乡居民医保集中参保期限原则上为2025年10月29日至12月31日。","b":["2026年度全区城乡居民基本医疗保险集中参保期限从2025年10月29日开始，原则上至12月31日结束。","集中征缴期结束后，2026年1月1日至6月30日之间缴费的，补缴金额为400元/人；2026年7月1日至12月31日之间缴费的，补缴金额为1100元/人。"],"src":"宁夏医保局","url":"https://ylbz.nx.gov.cn/zfxxgk/fdzdgknr/tzgg/202510/t20251030_5069275.html","dt":"2025-10-30","rg":"宁夏"},{"c":"si","t":"关于公布2025年职工基本养老保险缴费基数上下限和基本养老金计发基数有关问题的通知","s":"粤人社发〔2025〕32号规定：自2025年1月1日起，全省机关事业单位养老保险缴费基数上限27549元、下限5510元；自2025年7月1日起，全省企业职工基本养老保险缴费基数上限27549元，广州市、省直下限5510元，其他地区下限4775元。2025年计发基数9493元/月，深圳另行公布。","b":["粤人社发〔2025〕32号。为做好职工基本养老保险参保缴费和待遇计发相关工作，根据有关规定，现就2025年职工基本养老保险缴费基数上下限和基本养老金计发基数有关问题通知如下：","一、自2025年1月1日起，全省机关事业单位养老保险缴费基数上限调整为27549元，缴费基数下限调整为5510元；自2025年7月1日起，全省企业职工基本养老保险缴费基数上限调整为27549元，广州市、省直缴费基数下限调整为5510元，其他地区缴费基数下限调整为4775元。二、2025年1月1日至12月31日我省企业职工基本养老保险和机关事业单位养老保险基本养老金计发基数为9493元/月，深圳市计发基数另行公布。广东省人力资源和社会保障厅、广东省财政厅、国家税务总局广东省税务局 2025年10月24日"],"src":"广东省人力资源和社会保障厅","url":"https://hrss.gd.gov.cn/zwgk/gsgg/content/mpost_4789648.html","dt":"2025-10-27","rg":"广东"},{"c":"si","t":"关于调整城乡居民基本养老保险个人缴费档次有关事项的通知","s":"辽宁自2026年1月1日起将城乡居民基本养老保险个人缴费档次调整为9档，最高5000元。","b":["从2026年1月1日起，辽宁全省城乡居民基本养老保险个人缴费档次调整为9档，分别为每年200元、300元、500元、800元、1000元、2000元、3000元、4000元、5000元。","对应9个缴费档次，各地缴费补贴标准应不低于40元至180元，所需资金由市、县政府承担。对缴费困难群体仍保留每人每年100元缴费档次。"],"src":"辽宁省人社厅","url":"https://rst.ln.gov.cn/rst/zxzx/gsgg/2025102711503374862/index.shtml","dt":"2025-10-27","rg":"辽宁"},{"c":"si","t":"广州市医疗保险服务中心关于开展2026年度广州市城乡居民基本医疗保险集中参保缴费工作的通告","s":"通告明确2026年度广州城乡居民医保集中参保缴费安排及标准：在校学生个人413元、财政956元；其他参保人员个人549元、财政820元。在校学生集中期至2025年12月20日，其他人员自2025年10月下旬至12月20日。","b":["为持续深入推进全民参保计划，切实保障参保人员医保权益，根据国办发〔2024〕38号、广州市人民政府令第193号、穗府办规〔2021〕14号等有关规定，我市正式启动2026年度城乡居民基本医疗保险参保缴费工作。","缴费标准：在校学生个人缴费每人413元、财政补助每人956元；其他参保人员个人缴费每人549元、财政补助每人820元。国家、省、市有新规定的，从其规定。2026年度城乡居民医保集中参保和缴费时间：在校学生为2025年9月下旬至2025年12月20日，其他参保人员为2025年10月下旬至2025年12月20日。"],"src":"广州市医疗保障局","url":"https://www.gz.gov.cn/zt/zzyyzq/tzgg/content/post_10493724.html","dt":"2025-10-17","rg":"广州"},{"c":"si","t":"《杭州市基本医疗保障办法》政策解读","s":"官方解读明确2026年1月1日起施行新办法，调整2026年度居民医保筹资标准，并自2027年起建立与居民人均可支配收入挂钩的动态调整机制。","b":["主要调整明确了基本医疗保险、大病保险、医疗救助、生育保险等各险种的参保范围、筹资和待遇标准，以及就医结算、公共服务、医药服务、基金监管等内容。修订后的《办法》允许持本市公安部门核发的有效期内《浙江省居住证》并在本市办理就业登记的非本市户籍灵活就业人员参加职工医保；放宽非本市户籍学龄前儿童和中小学生参保条件。","按照相关政策规定调整我市2026年度居民医保筹资标准并建立居民医保筹资动态调整机制，明确自2027年起，居民医保筹资标准与我市居民人均可支配收入水平相挂钩，具体标准每年由市医保局会市财政局、市税务局研究确定后向社会公布。《办法》将自2026年1月1日起施行。"],"src":"杭州市人民政府公报","url":"https://zfgb.hangzhou.gov.cn/15/110220253/t114220253104/529705.shtml","dt":"2025-10-15","rg":"杭州"},{"c":"si","t":"《医保进行时》第289期｜江西省2026年度城乡居民医保参保缴费开始啦！","s":"江西2026年度城乡居民医保集中征缴期为2025年10月15日至2026年2月28日，个人缴费400元。","b":["江西省2026年度城乡居民医保参保缴费已于10月15日正式启动。普通居民个人缴费标准为每人每年400元，财政补助标准为每人每年700元。","集中征缴期为2025年10月15日至2026年2月28日。2025年度未断保且在集中征缴期内缴费的，待遇享受期为2026年1月1日至12月31日。"],"src":"江西省医保局","url":"https://ybj.jiangxi.gov.cn/jxsylbzj/col/col81085/content/content_1985242286750371840.html","dt":"2025-10-15","rg":"江西"},{"c":"si","t":"杭州市人民政府关于印发杭州市基本医疗保障办法的通知","s":"杭政函〔2025〕88号印发《杭州市基本医疗保障办法》，自2026年1月1日起施行，明确职工医保、居民医保筹资和待遇等规定。","b":["各区、县（市）人民政府，市政府各部门、各直属单位：现将《杭州市基本医疗保障办法》印发给你们，请结合实际，认真组织实施。杭州市人民政府 2025年9月30日（此件公开发布）。","全市执行统一的居民医保筹资标准，其中2026年度居民医保筹资标准为：1.少儿医保：每人每年1090元，其中个人缴纳340元，政府补助750元；2.大学生医保：每人每年430元，其中个人缴纳100元，同级财政补助330元。本办法自2026年1月1日起施行，由市医保局负责牵头组织实施。其中，自本办法印发之日起符合基本医疗保险参保条件的，适用本办法规定的参保范围和筹资标准。前发杭政〔2020〕56号同时废止。"],"src":"杭州市人民政府","url":"https://zfgb.hangzhou.gov.cn/10/110220253/t114220253104/529703.shtml","dt":"2025-09-30","rg":"杭州"},{"c":"si","t":"关于公布2025年度全省社会保险缴费基数上下限具体标准等参数的通知","s":"四川省公布2025年度职工基本养老保险、失业保险、工伤保险缴费基数上限22938元/月、下限4588元/月；灵活就业等医保缴费涉及社平工资按7646元/月执行。该参数同时用于2026年省本级职工医保征缴。","b":["2025年度全省职工基本养老保险（含企业职工基本养老保险和机关事业单位工作人员养老保险）、失业保险、工伤保险缴费基数上限为22938元/月，下限为4588元/月。","2025年度灵活就业人员、领取失业保险金期间的人员等参加职工基本医疗保险、生育保险、长期护理保险，缴费涉及使用上年度全省城镇全部单位就业人员平均工资的，以7646元/月为依据执行。2025年度工伤保险待遇确定和调整涉及使用上年度全省城镇全部单位就业人员平均工资的，按7646元/月执行。"],"src":"四川省人力资源和社会保障厅","url":"https://rst.sc.gov.cn/rst/gsgg/2025/9/22/9a8e857a4e204a4da4d30d2d47279d43.shtml","dt":"2025-09-22","rg":"其他市"},{"c":"si","t":"山东省人力资源和社会保障厅 山东省医疗保障局 国家税务总局山东省税务局 国家税务总局青岛市税务局关于公布2025年度社会保险缴费基数等有关问题的通知","s":"鲁人社字〔2025〕91号明确2025年度全省职工基本养老保险、职工基本医疗保险、工伤保险、失业保险个人月缴费基数上限22518元、下限4504元。","b":["鲁人社字〔2025〕91号。根据国家有关规定，现就2025年度社会保险缴费基数等有关问题通知如下：","一、2025年度全省职工基本养老保险、职工基本医疗保险、工伤保险、失业保险个人月缴费基数上限为22518元，下限为4504元。二、计发以统筹地区上年度职工月平均工资为基数的相关工伤保险待遇、计算当年职工养老保险月缴费工资指数时，以7506元为基数。山东省人力资源和社会保障厅、山东省医疗保障局、国家税务总局山东省税务局、国家税务总局青岛市税务局 2025年9月22日。"],"src":"山东省人力资源和社会保障厅","url":"https://hrss.shandong.gov.cn/articles/ch06567/202509/ba67d56d-ccfe-486a-9fc0-2e974bb22aef.shtml","dt":"2025-09-22","rg":"其他市"},{"c":"si","t":"关于发布吉林省社会保险缴费基数和计发基数的通知","s":"吉林明确2025年7月1日至2026年6月30日职工基本养老保险个人缴费基数上限21966元/月、下限4393.2元/月。","b":["经省政府批准，2025年7月1日至2026年6月30日，吉林职工基本养老保险职工个人缴费基数上限为21966元/月，下限为4393.2元/月，个体参保人员可在上下限范围内选择适当缴费基数。","2025年全省（不含长春市、农垦企业）城镇职工基本养老金计发基数为87865元/年，长春市95739元/年，农垦企业26681元/年。"],"src":"吉林省人社厅","url":"https://xxgk.jl.gov.cn/zcbm/fgw_97992/xxgkmlqy/202509/t20250922_9324837.html","dt":"2025-09-22","rg":"吉林"},{"c":"si","t":"湖北省人力资源和社会保障厅 省医疗保障局 国家税务总局湖北省税务局关于我省2025年度社会保险缴费基数标准的通知","s":"鄂人社发〔2025〕28号分三档公布2025年度城镇职工养老、职工医保（生育）、失业、工伤缴费基数月标准及个人缴费上下限。","b":["鄂人社发〔2025〕28号。现就我省2025年度城镇职工基本养老保险、职工基本医疗保险（生育保险）、失业保险、工伤保险缴费基数标准及个人缴费基数上下限通知如下：","第1档：武汉市和省直，缴费基数月标准7496元，个人缴费基数上限22488元、下限4498元。第2档：黄石、十堰、襄阳、宜昌、荆门、随州、恩施州，月标准7226元，上限21678元、下限4299元。第3档：荆州、鄂州、孝感、黄冈、咸宁、仙桃、天门、潜江、神农架林区，月标准7154元，上限21462元、下限4254元。用人单位应在上下限范围内据实申报。湖北省人力资源和社会保障厅、省医疗保障局、国家税务总局湖北省税务局 2025年9月19日。"],"src":"湖北省人力资源和社会保障厅","url":"https://rst.hubei.gov.cn/zfxxgk/zc/qtzdgkwj/202509/t20250919_5775307.shtml","dt":"2025-09-19","rg":"其他市"},{"c":"si","t":"《关于公布2025年社会保险有关基数的通知》政策解读","s":"浙江省人力社保厅解读浙人社发〔2025〕52号：从2025年1月1日起，社会保险个人缴费基数上限25299元/月，下限4986元/月。2024年度加权平均工资101194元（8433元/月）。2025年新退休人员相关待遇按2024年度加权平均工资计算支付。","b":["根据国办发〔2019〕13号和企业职工基本养老保险全国统筹等有关规定，各省要以本省上年度非私营单位就业人员和私营单位就业人员平均工资加权计算平均工资，核定当年社会保险缴费基数的上限和下限。2024年度我省非私营和私营单位就业人员加权平均工资为101194元（8433元/月）。","从2025年1月1日起，我省2025年缴费基数上限按2024年加权平均工资的300%确定，为25299元/月；缴费基数下限按2023年加权平均工资8310元/月的60%确定，为4986元/月。2025年新退休人员养老保险待遇及医疗保险、工伤保险等有关待遇，根据2024年度加权平均工资计算支付。"],"src":"浙江省人力资源和社会保障厅","url":"https://zhejiang.chinatax.gov.cn/art/2025/9/18/art_7575_642624.html","dt":"2025-09-18","rg":"浙江"},{"c":"si","t":"浙江省人力资源和社会保障厅 浙江省财政厅 浙江省统计局 浙江省医疗保障局 国家税务总局浙江省税务局关于公布2025年社会保险有关基数的通知","s":"浙人社发〔2025〕52号公布2024年加权平均工资101194元，并据此调整社会保险个人缴费基数上限，下限按2023年加权平均工资的60%确定。该基数同时作为2026年杭州职工医保灵活就业缴费测算依据。","b":["各市、县（市、区）人力资源和社会保障局、财政局、统计局、医疗保障局，国家税务总局浙江省各市、县（市、区）税务局，各行业统筹单位，省级各单位，中央部属在杭有关单位：","根据有关数据测算，2024年浙江省非私营和私营单位就业人员加权平均工资为101194元。请各地以此为依据计算2025年社会保险相关待遇，并按规定及时调整社会保险个人缴费基数上限。为适当减轻企业和个人缴费负担，2025年社会保险个人缴费基数下限按2023年浙江省非私营和私营单位就业人员加权平均工资的60%确定，养老保险缴费指数据实计算。浙江省人力资源和社会保障厅、财政厅、统计局、医疗保障局、国家税务总局浙江省税务局 2025年9月17日"],"src":"国家税务总局浙江省税务局","url":"https://zhejiang.chinatax.gov.cn/art/2025/9/18/art_25180_84282.html","dt":"2025-09-17","rg":"浙江"},{"c":"si","t":"国家医保局局长章轲等出席国务院新闻办公室新闻发布会 介绍“十四五”时期深化医保改革，服务经济社会发展有关情况","s":"国家医保局在国新办发布会上介绍，“十四五”期间基本医保参保率稳定在95%左右，2024年度全国基本医保参保人数达13.27亿人。","b":["“十四五”期间，基本医疗保险参保率稳定在95%左右，2024年度全国基本医保参保人数达到13.27亿人。","基本医保参保长效机制不断健全完善，医疗救助每年资助参保约8000万人。","持续巩固全民参保成果，2021-2024年，累计有近200亿人次享受就诊医保报销，2024年是2020年的1.6倍。","强化生育保险保障，截至2025年6月，有2.53亿人参加生育保险，基金累计支出4383亿元，享受待遇9614.32万人次。31个省份和兵团都将辅助生殖项目纳入医保报销范围。","“十四五”时期各项医保帮扶政策累计惠及农村低收入人口就医达到6.73亿人次，减轻费用负担超过6500亿元。"],"src":"国家医疗保障局","url":"https://www.nhsa.gov.cn/art/2025/7/24/art_14_17369.html","dt":"2025-07-24","rg":"全国"},{"c":"si","t":"关于调整全省城乡居民基本养老保险个人缴费档次的通知","s":"陕西调整城乡居民养老保险缴费档次，增加4000元、5000元、6000元三档并明确对应补贴。","b":["从2025年6月1日起，增加4000元、5000元、6000元3个缴费档次，取消200元、400元、600元3个缴费档次。调整后为每人每年300元至6000元共10档。","个人缴费300元补贴45元，最高6000元档补贴300元。对缴费困难群体暂时保留每人每年100元缴费档次。"],"src":"陕西省人社厅","url":"https://rst.shaanxi.gov.cn/sy/tzgg/202505/t20250523_3521983.html","dt":"2025-05-23","rg":"陕西"},{"c":"si","t":"渐进式延迟法定退休年龄正式启动","s":"自 2025-01-01 起，男职工法定退休年龄每四个月延迟一个月，逐步延迟至 63 周岁；女职工原 50 / 55 周岁的，分别逐步延迟至 55 / 58 周岁。同时新增弹性退休。","b":["自 2025-01-01 起，男职工法定退休年龄每四个月延迟一个月，逐步延迟至 63 周岁；女职工原 50 / 55 周岁的，分别逐步延迟至 55 / 58 周岁。","同时新增弹性退休：达到最低缴费年限可自愿提前，最长不超过 3 年，且不得低于原法定退休年龄。","发布机关：全国人民代表大会常务委员会。适用范围：全国。"],"src":"全国人民代表大会常务委员会","url":"https://www.gov.cn/yaowen/liebiao/202409/content_6974294.htm","dt":"2025-01-01","rg":"全国"},{"c":"si","t":"全国人民代表大会常务委员会关于实施渐进式延迟法定退休年龄的决定","s":"全国人大常委会决定同步启动延迟男、女职工法定退休年龄，用十五年时间逐步调整，并批准《国务院关于渐进式延迟法定退休年龄的办法》。","b":["同步启动延迟男、女职工法定退休年龄，用十五年时间，男职工从60周岁延迟至63周岁，女职工从50、55周岁分别延迟至55、58周岁。","从2025年1月1日起，男职工和原法定退休年龄55周岁的女职工每四个月延迟一个月；原50周岁的女职工每二个月延迟一个月。","从2030年1月1日起，按月领取基本养老金最低缴费年限由十五年逐步提高至二十年，每年提高六个月。","职工达到最低缴费年限可自愿弹性提前退休，提前不超过三年；协商一致可弹性延迟退休，最长不超过三年。","对领取失业保险金且距法定退休年龄不足一年的人员，领取年限延长至法定退休年龄，由失业保险基金缴纳养老保险费。"],"src":"新华社","url":"http://www.xinhuanet.com/20240913/1c6b59d0ad414943b2c877dc799ecda0/c.html","dt":"2024-09-13","rg":"全国"},{"c":"si","t":"国家医保局出席国新办“推动高质量发展”系列主题新闻发布会","s":"国家医保局介绍，基本医保年度参保率稳定在95%左右，职工医保、居民医保政策范围内住院费用报销比例分别稳定在80%和70%左右。","b":["建立健全基本医疗保险、大病保险、医疗救助三重梯次减负的基本医疗保障制度，制定医保待遇清单，统一全国医保药品目录。","稳步提高医保筹资水平，健全参保长效机制，基本医保年度参保率稳定在95%左右。","职工医保、居民医保政策范围内住院费用报销比例分别稳定在80%和70%左右。","巩固提升住院保障水平，全面建立职工医保普通门诊统筹和城乡居民高血压、糖尿病门诊用药保障机制。","积极应对人口老龄化，稳步推进长期护理保险制度试点，已覆盖49个城市、1.8亿人。"],"src":"国家医疗保障局","url":"https://www.nhsa.gov.cn/art/2024/9/10/art_14_13819.html","dt":"2024-09-10","rg":"全国"},{"c":"si","t":"国新办举行国务院政策例行吹风会 介绍《关于健全基本医疗保险参保长效机制的指导意见》有关情况","s":"国新办吹风会介绍，指导意见明确强化常住地参保、健全激励约束等机制，参保人可享“放、扩、提、奖、便”红利。","b":["《指导意见》明确强化常住地参保、健全激励约束、完善筹资政策、健全精准扩面等机制。","“放”：放宽放开参保户籍限制，超大城市要取消对灵活就业人员、农民工、新就业形态人员参加职工医保的户籍限制。","“扩”：扩大职工医保个人账户共济范围，由家庭成员扩展到近亲属。","“提”：连续参加居民医保的参保人员提高大病保险最高支付限额。","自2025年起，连续参加居民医保满4年，之后每连续参保1年，每年可提高大病保险最高支付限额不低于1000元。"],"src":"国家医疗保障局","url":"https://www.nhsa.gov.cn/art/2024/8/1/art_14_13433.html","dt":"2024-08-01","rg":"全国"},{"c":"si","t":"离职后公积金：账户封存；封存满半年可销户提取仅限非本市户籍","s":"与单位解除或终止劳动关系后，公积金账户转为封存。非本市户籍职工若未在异地继续缴存、账户封存满半年，可申请销户提取（另有贷款与冻结等限制）。","b":["与单位解除或终止劳动关系后，公积金账户转为封存状态。","非本市户籍职工若未在异地继续缴存、账户封存满半年，可申请销户提取；另需满足本市无未结清公积金贷款、无套取行为（或已全额退回）、账户未被依法冻结。","线上办理：「广州住房公积金管理中心」公众号 → 提取业务 → 新增提取 → 非住房性消费提取 → 异地户口离职。","「封存满半年销户提取」路径写明只给非本市户籍。本市户籍离职后的提取路径需另查官方出处。","发布机关：广州住房公积金管理中心。适用范围：广州市。"],"src":"广州住房公积金管理中心","url":"http://gjj.gz.gov.cn/bsfw/cjwt/tq/content/post_10095338.html","dt":"2023-08-01","rg":"广州市"},{"c":"si","t":"失业保险金领取期限：按累计缴费年限分三档，最长 24 个月","s":"累计缴费满 1 年不足 5 年最长 12 个月；满 5 年不足 10 年最长 18 个月；10 年以上最长 24 个月。","b":["累计缴费满 1 年不足 5 年 → 最长 12 个月；满 5 年不足 10 年 → 最长 18 个月；10 年以上 → 最长 24 个月。","重新就业后再次失业的，缴费时间重新计算，但可与上次应领未领的期限合并计算，合计不超过 24 个月。","发布机关：国务院（失业保险条例）。适用范围：全国（广州执行）。"],"src":"广州市人力资源和社会保障局","url":"https://rsj.gz.gov.cn/zcfg/flfg/content/post_7993534.html","dt":"1999-01-22","rg":"全国（广州执行）"},{"c":"si","t":"缴满最低年限 ≠ 可以不缴（在职期间强制缴纳）","s":"用人单位与职工必须依法缴纳社会保险费，属法定义务，不因已缴满最低年限而免除。只有非在职身份才存在缴满即可自行停缴的选择空间。","b":["《社会保险费征缴暂行条例》确立：用人单位与职工必须依法缴纳社会保险费，属法定义务，不因已缴满最低年限而免除。","只有非在职身份（灵活就业 / 自主缴纳）才存在「缴满即可自行停缴」的选择空间。","本条官方渠道目前不足三方互证，入库时保留，阅读时需再核。","发布机关：国务院（社会保险费征缴暂行条例）。适用范围：全国。"],"src":"中国政府网","url":"https://www.gov.cn/gongbao/content/2000/content_60086.htm","dt":"1999-01-22","rg":"全国"}];

function hzPromoHTML(){

    <span class="hz-pt">${hzEsc(o.t)}</span>
    <a class="hz-go" href="${o.go}" target="_blank" rel="noopener">Go</a></div>
    <button class="hz-swap" id="hzSwap">换一条 ›</button>`;
}
function hzRender(){
  const list=document.getElementById('hzList'), det=document.getElementById('hzDetail');
  if(!list) return;
  const zh = (typeof lang==='undefined') || lang==='zh';
  const T=document.getElementById('hzTabs');
  if(T) [...T.children].forEach(b=>b.setAttribute('aria-selected', b.dataset.c===hzCat));
  const h1=document.getElementById('hzH1'), ld=document.getElementById('hzLead');
  if(h1) h1.textContent = zh?'哈哈资讯':'Haha News';
  if(ld) ld.textContent = zh?'只搬运官方原文 · 每条都标来源、给官方链接'
                            :'Official sources only — every item cites and links its source.';
  if(T){ T.children[0].textContent = zh?'社保退休':'Pension & Retirement';
         T.children[1].textContent = 'AI'; }
  if(hzOpen!==null){
    const a=HZ[hzOpen];
    list.hidden=true; det.hidden=false;
    det.innerHTML=`<button class="hz-back" id="hzBack">‹ ${zh?'返回列表':'Back'}</button>
      <h2>${hzEsc(a.t)}</h2>
      <div class="hz-meta"><span>${hzEsc(a.src)}</span>${a.dt?`<span>·</span><span>${a.dt}</span>`:''}${a.rg?`<span>·</span><span>${hzEsc(a.rg)}</span>`:''}</div>
      ${(a.b.length?a.b:[a.s]).map(p=>`<p class="bd">${hzEsc(p)}</p>`).join('')}
      <div class="hz-src">${zh?'来源':'Source'}：${hzEsc(a.src)}<br>
        <a href="${hzEsc(a.url)}" target="_blank" rel="noopener">${hzEsc(a.url)}</a></div>
      ${hzPromoHTML()}`;
    det.querySelector('#hzBack').onclick=()=>{hzOpen=null;hzRender();window.scrollTo({top:0,behavior:'smooth'});};
    const sw=det.querySelector('#hzSwap'); if(sw) sw.onclick=()=>{hzPromo++;hzRender();};
    return;
  }
  det.hidden=true; list.hidden=false;
  const rows=HZ.map((a,i)=>({a,i})).filter(x=>x.a.c===hzCat);
  list.innerHTML=rows.map(({a,i})=>`<button class="hz-item" data-i="${i}">
      <h3>${hzEsc(a.t)}</h3><p>${hzEsc(a.s)}</p>
      <div class="hz-meta"><span>${hzEsc(a.src)}</span>${a.dt?`<span>·</span><span>${a.dt}</span>`:''}</div>
    </button>`).join('') || `<p style="color:var(--ink3)">${zh?'这一栏暂时没有条目。':'Nothing here yet.'}</p>`;
  list.querySelectorAll('.hz-item').forEach(b=>b.onclick=()=>{
    hzOpen=+b.dataset.i; hzRender(); window.scrollTo({top:0,behavior:'smooth'});});
}
{ const T=document.getElementById('hzTabs');
  if(T) T.addEventListener('click',e=>{const b=e.target.closest('button');
    if(!b)return; hzCat=b.dataset.c; hzOpen=null; hzRender();}); }
hzRender();
/* 语言切换后把壳文字也刷一遍（正文永远不动） */
{ const _r=window.render; if(typeof _r==='function'){ window.render=function(){ _r.apply(this,arguments); hzRender(); }; } }

</script>
