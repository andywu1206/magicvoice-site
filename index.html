<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harry App Store</title>
<!-- ══════════════════════════════════════════════════════════════════
     根域名 = Harry App Store（Harry 2026-08-24 口述立约）
     规范：~/.claude/rules/规则_域名入口重排_根域名等于HarryAppStore_*.md

     🔴 给下一个 AI：这里是跳转页，不是"没做完"，也不是 bug。
     为什么不把 App Store 页整份复制到根：
       apps/index.html 由 项目0_MiniSite/index.html → build_public.py 产出，
       复制到根 = 同一个页面在仓库里存两份产物，必然各自漂移。
       2026-08-24 已经被这个坑过一次（913 号话题把 .p8-hero 564px
       只改在产物上，真源重建时差点整个冲掉）。
       所以根只做跳转，App Store 页永远只有 /apps/ 这一份。
     canonical 指向 /apps/，避免搜索引擎当成重复内容。
     输入法官网已降级到 /aria/ ——看到根不是输入法官网，不要"好心"改回去。
     ══════════════════════════════════════════════════════════════════ -->
<link rel="canonical" href="https://ariamagicvoice.com/apps/">
<meta name="google-site-verification" content="NI1hYYh1GTdrb5OvsRXibaGKovFZMusr_bONquV9d-0">
<meta http-equiv="refresh" content="0; url=/apps/">
<meta name="description" content="Harry App Store — i人洞府 Everything About Me、Remember Me 记住我、Aria Magic Voice 输入法。">
<link rel="icon" href="/favicon.svg">
<style>
  :root{color-scheme:light dark}
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;background:#faf9f5;color:#141413;
       font:400 15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
       text-align:center;padding:24px}
  @media (prefers-color-scheme:dark){body{background:#141413;color:#e8e6dd}}
  a{color:#2563EB;text-decoration:none;font-weight:600}
  a:hover{text-decoration:underline}
  .t{font-size:19px;font-weight:700;letter-spacing:-.01em;margin-bottom:8px}
  .s{opacity:.62;font-size:13.5px}
  .l{margin-top:18px;font-size:14px}
</style>
</head>
<body>
  <div>
    <div class="t">Harry App Store</div>
    <div class="s">正在前往 · Redirecting…</div>
    <!-- 兜底：JS 与 meta refresh 都不生效时，用户仍然点得走，永远不留死页 -->
    <div class="l"><a href="/apps/">进入 Harry App Store →</a></div>
    <div class="l s">找 Aria Magic Voice 输入法官网？ <a href="/aria/">前往 /aria/</a></div>
  </div>
<script>location.replace('/apps/');</script>
</body>
</html>
